<!doctype html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<title>GeoMaster чат</title>
<meta name="description" content="GeoMaster — Beeline-ға арзан интернет. Чатта жазыңыз, бот бірден жауап береді.">
<meta name="theme-color" content="#008069">
<meta name="robots" content="noindex">
<style>
/* Owner request (2026-10-21): our own web chat - the same AI seller as the Telegram bot, nothing to ban.
   Looks like the messenger people already know (owner: "чтобы деды не запутались"), under our own name -
   no third-party logo or name anywhere. Lives next to the site (/chat/) and shares its browser identity. */
:root{
 --hdr:#008069;--hdr-ink:#ffffff;--wall:#efeae2;--dot:rgba(0,0,0,.035);
 --in:#ffffff;--out:#d9fdd3;--ink:#111b21;--dim:#667781;--tick:#53bdeb;
 --green:#00a884;--link:#027eb5;--line:#e9edef;--chip:#ffffff;--bad:#d4442c;
 --bar:#f0f2f5;--field:#ffffff;--shadow:0 1px .5px rgba(11,20,26,.13);
}
@media (prefers-color-scheme: dark){
 :root:not([data-theme="light"]){
  --hdr:#202c33;--hdr-ink:#e9edef;--wall:#0b141a;--dot:rgba(255,255,255,.025);
  --in:#202c33;--out:#005c4b;--ink:#e9edef;--dim:#8696a0;--link:#53bdeb;--line:#2a3942;--chip:#202c33;
  --bar:#202c33;--field:#2a3942;--shadow:0 1px .5px rgba(0,0,0,.4);
 }
}
:root[data-theme="dark"]{
 --hdr:#202c33;--hdr-ink:#e9edef;--wall:#0b141a;--dot:rgba(255,255,255,.025);
 --in:#202c33;--out:#005c4b;--ink:#e9edef;--dim:#8696a0;--link:#53bdeb;--line:#2a3942;--chip:#202c33;
 --bar:#202c33;--field:#2a3942;--shadow:0 1px .5px rgba(0,0,0,.4);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{overflow-x:hidden;background:var(--wall);color:var(--ink);font:400 15.5px/1.38 "Segoe UI",Roboto,"Helvetica Neue",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
.app{display:flex;flex-direction:column;height:100dvh;width:100%;max-width:560px;margin:0 auto;overflow:hidden;position:relative;
 background-color:var(--wall);background-image:radial-gradient(var(--dot) 1.2px,transparent 1.3px),radial-gradient(var(--dot) 1.2px,transparent 1.3px);background-size:22px 22px;background-position:0 0,11px 11px}
header{display:flex;align-items:center;gap:10px;padding:8px 10px;padding-top:max(8px,env(safe-area-inset-top));background:var(--hdr);color:var(--hdr-ink);flex:none;min-height:58px}
.ava{width:40px;height:40px;border-radius:50%;background:#ffd528;display:grid;place-items:center;flex:none}
.ava svg{width:58%;height:58%;fill:#171714}
.who{flex:1;min-width:0}.who b{display:block;font-weight:600;font-size:17px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who small{display:block;font-size:13px;line-height:1.3;opacity:.85}
.lang{display:flex;gap:2px}
.lang button{border:1px solid rgba(255,255,255,.35);background:transparent;color:var(--hdr-ink);font:600 12px "Segoe UI",Roboto,Arial,sans-serif;padding:5px 8px;border-radius:14px;cursor:pointer;opacity:.75}
.lang button.on{background:rgba(255,255,255,.22);opacity:1}
#log{flex:1;min-height:0;overflow-y:auto;padding:10px 4.5% 6px;display:flex;flex-direction:column;gap:2px;overscroll-behavior:contain}
.day{align-self:center;background:var(--chip);color:var(--dim);font-size:12.5px;padding:5px 12px;border-radius:7.5px;margin:6px 0 8px;box-shadow:var(--shadow);text-transform:uppercase}
.msg{max-width:85%;padding:6px 7px 8px 9px;border-radius:7.5px;box-shadow:var(--shadow);white-space:pre-wrap;overflow-wrap:anywhere;position:relative;color:var(--ink)}
.msg .tm{float:right;margin:8px 0 -6px 10px;font-size:11px;color:var(--dim);line-height:1;white-space:nowrap}
.msg.me .tm::after{content:" ✓✓";color:var(--tick);letter-spacing:-3px}
.msg.bot{align-self:flex-start;background:var(--in)}
.msg.me{align-self:flex-end;background:var(--out)}
.msg.bot.first{border-top-left-radius:0;margin-top:6px}
.msg.me.first{border-top-right-radius:0;margin-top:6px}
.msg.bot.first::before{content:"";position:absolute;left:-8px;top:0;border-top:0 solid transparent;border-right:8px solid var(--in);border-bottom:10px solid transparent}
.msg.me.first::before{content:"";position:absolute;right:-8px;top:0;border-left:8px solid var(--out);border-bottom:10px solid transparent}
.msg a{color:var(--link);text-decoration:none}
.msg b{font-weight:700}
.typing{align-self:flex-start;background:var(--in);border-radius:7.5px;border-top-left-radius:0;padding:11px 13px;box-shadow:var(--shadow);display:flex;gap:4px;margin-top:6px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--dim);animation:blink 1.2s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,60%,100%{opacity:.25}30%{opacity:1}}
/* the live order card - a bot message with reply buttons under it, like an interactive message */
.card{align-self:flex-start;width:85%;max-width:360px;min-width:0;margin-top:6px;background:var(--in);color:var(--ink);border-radius:7.5px;border-top-left-radius:0;box-shadow:var(--shadow);overflow:hidden}
.card[hidden]{display:none}
.card .body{padding:8px 10px 9px;display:flex;flex-direction:column;gap:6px}
.card h3{font-weight:700;font-size:15.5px;line-height:1.3}
.card p{color:var(--dim);font-size:14px;white-space:pre-line}
.card .big{font-weight:700;font-size:24px;color:var(--ink)}
.acts{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.acts > *{border-top:1px solid var(--line)}.acts > *:first-child{border-top:0}
.btn{appearance:none;border:0;background:transparent;color:var(--link);font:500 15.5px/1.3 "Segoe UI",Roboto,Arial,sans-serif;padding:12px 10px;text-align:center;cursor:pointer;text-decoration:none;display:block;width:100%}
.btn.main{color:var(--green);font-weight:700}
.btn.kaspi{background:#f14635;color:#fff;font-weight:700}
.btn:disabled{opacity:.45;cursor:default}
.btn .sub{color:var(--dim);font-size:13px;margin-left:4px}
.err{color:var(--bad);font-weight:600;font-size:14px}
.okline{color:var(--green);font-weight:700}
footer{flex:none;display:flex;gap:6px;align-items:flex-end;padding:6px 6px;padding-bottom:max(6px,env(safe-area-inset-bottom));background:transparent}
.field{flex:1;min-width:0;background:var(--field);border-radius:24px;box-shadow:var(--shadow);display:flex;align-items:center;padding:0 8px 0 14px;min-height:48px}
.field textarea{flex:1;min-width:0;width:100%;border:0;outline:0;background:transparent;color:var(--ink);font:400 16.5px/1.35 "Segoe UI",Roboto,Arial,sans-serif;resize:none;max-height:120px;padding:12px 0}
.field textarea::placeholder{color:var(--dim)}
.mode{font:700 11px "Segoe UI",Roboto,Arial,sans-serif;letter-spacing:.03em;color:#fff;background:var(--green);border-radius:999px;padding:4px 8px;margin-right:6px;white-space:nowrap}
.send{width:48px;height:48px;border-radius:50%;border:0;background:var(--green);display:grid;place-items:center;cursor:pointer;flex:none;box-shadow:var(--shadow)}
.send svg{width:22px;height:22px;fill:#fff;margin-left:3px}
:where(button,a,textarea):focus-visible{outline:2px solid var(--link);outline-offset:2px}
.offline{position:absolute;top:66px;left:50%;transform:translateX(-50%);background:#111b21;color:#fff;font:600 12.5px "Segoe UI",Roboto,Arial,sans-serif;padding:6px 12px;border-radius:999px;z-index:3}
@media (prefers-reduced-motion:reduce){.typing i{animation:none}}
</style>
</head>
<body>
<div class="app">
 <header>
  <div class="ava" aria-hidden="true"><svg viewBox="0 0 32 32"><rect x="6" y="19" width="4" height="7" rx="1.5"/><rect x="12" y="15" width="4" height="11" rx="1.5"/><rect x="18" y="10" width="4" height="16" rx="1.5"/><rect x="24" y="5" width="4" height="21" rx="1.5"/></svg></div>

 </footer>
 <div class="offline" id="offline" hidden></div>
</div>
<script>
'use strict';
const API='/api';
const TG_BOT='GeoMaster1_bot';
const STR={
 kk:{sub:'желіде',ph:'Хабарлама жазыңыз…',ph_phone:'Beeline нөмірі: 7XX XXX XX XX',ph_code:'SMS-кодты жазыңыз',m_phone:'НӨМІР',m_code:'КОД',
  hello:'Сәлеметсіз бе! 👋 GeoMaster — Beeline-ға арзан интернет.\n\n🚀 10 ГБ — 500 ₸\n🔥 20 ГБ — 1 000 ₸\n📅 30 күн · тариф өзгермейді\n\nТөменнен пакетті таңдаңыз немесе сұрағыңызды жазыңыз 👇',
  choose:'Пакетті таңдаңыз',choose_p:'30 күн · негізгі тариф өзгермейді · тек Beeline',per:'30 күнге',
  phone_t:'Қай Beeline нөміріне қосамыз?',phone_p:'Нөмірді төменге жазыңыз 👇',
  pay_t:'Төлеуге',pay_btn:'Kaspi-де төлеу',pay_again:'Kaspi-ді қайта ашу',pay_wait:'Төлем күтілуде… Kaspi-де төлеген соң осы чатқа қайтыңыз — бәрі осында болады.',pay_change:'Нөмірді өзгерту',
  otp_t:'✅ Төлем келді!',otp_p:n=>`${n} нөміріне Beeline-нан SMS-код келді.\nКодты осында, төменге жазыңыз 👇`,otp_new:'Жаңа код сұрау',otp_sent:'Жаңа код жіберілді 📩',otp_bad:'Код қате, қайта жазыңыз',otp_wait:s=>`Beeline жаңа кодты ${s} кейін жібереді`,otp_check:'Код тексерілуде…',

  done_t:g=>`✅ ${g} ГБ қосылды!`,done_p:n=>`${n} нөмірі. Тексеру: *106# немесе Janymda қосымшасы.\nSMS келмеуі мүмкін — ГБ бәрібір түседі.`,more:'Тағы пакет алу',
  fail_t:'Қосылмады',fail_p:'Уайымдамаңыз — маман тексеріп, өзі хабарласады. Ақшаңыз сақталады.',
  e_phone:'Нөмір дұрыс емес. 7XX XXX XX XX форматында жазыңыз',e_limit:'Бұл нөмірге бүгінгі лимит бітті. Ертең қайталаңыз немесе басқа нөмір жазыңыз.',e_net:'Байланыс жоқ, қайталап көріңіз',e_beeline:'Тек Beeline нөмірлеріне қосылады',
  tg:'Telegram-да ыңғайлырақ: хабарламалар өзі келеді',other_pkg:'Басқа пакет',offline:'Байланыс үзілді, қайта қосылуда…',today:'Бүгін',typing:'жазып жатыр…',pick:'📶 Пакетті таңдау'},
 ru:{sub:'в сети',ph:'Напишите сообщение…',ph_phone:'Номер Beeline: 7XX XXX XX XX',ph_code:'Введите SMS-код',m_phone:'НОМЕР',m_code:'КОД',
  hello:'Здравствуйте! 👋 GeoMaster — дешёвый интернет на Beeline.\n\n🚀 10 ГБ — 500 ₸\n🔥 20 ГБ — 1 000 ₸\n📅 30 дней · тариф не меняется\n\nВыберите пакет ниже или напишите вопрос 👇',
  choose:'Выберите пакет',choose_p:'30 дней · основной тариф не меняется · только Beeline',per:'на 30 дней',
  phone_t:'На какой номер Beeline подключаем?',phone_p:'Напишите номер ниже 👇',
  pay_t:'К оплате',pay_btn:'Оплатить в Kaspi',pay_again:'Открыть Kaspi снова',pay_wait:'Ждём оплату… После оплаты в Kaspi вернитесь в этот чат — всё будет здесь.',pay_change:'Изменить номер',
  otp_t:'✅ Оплата пришла!',otp_p:n=>`На номер ${n} пришёл SMS-код от Beeline.\nНапишите код здесь, внизу 👇`,otp_new:'Запросить новый код',otp_sent:'Новый код отправлен 📩',otp_bad:'Код неверный, введите ещё раз',otp_wait:s=>`Beeline пришлёт новый код через ${s}`,otp_check:'Проверяем код…',
  conn_t:'⏳ Подключаем…',conn_p:'Обычно 1–2 минуты. Ничего делать не нужно.',
  done_t:g=>`✅ ${g} ГБ подключено!`,done_p:n=>`Номер ${n}. Проверка: *106# или приложение Janymda.\nSMS может не прийти — ГБ всё равно начислены.`,more:'Купить ещё пакет',
  fail_t:'Не подключилось',fail_p:'Не переживайте — специалист проверит и сам свяжется. Деньги сохраняются.',
  e_phone:'Неверный номер. Напишите в формате 7XX XXX XX XX',e_limit:'На этот номер на сегодня лимит. Попробуйте завтра или другой номер.',e_net:'Нет связи, попробуйте ещё раз',e_beeline:'Подключаем только номера Beeline',
  tg:'В Telegram удобнее: сообщения приходят сами',other_pkg:'Другой пакет',offline:'Связь прервалась, переподключаемся…',today:'Сегодня',typing:'печатает…',pick:'📶 Выбрать пакет'}
};
let lang=(()=>{try{return localStorage.getItem('gm_lang')||'kk'}catch(_){return 'kk'}})();
if(!STR[lang])lang='kk';
const t=(k,...a)=>{const v=STR[lang][k];return typeof v==='function'?v(...a):v;};
let token=null,ctx=null,lastId=0,waitingReply=false,waitSince=0,cardKey='',otpError='',otpNote='',busy=false,doneShownFor=null;
const $=id=>document.getElementById(id);
const log=$('log'),inp=$('inp'),sendBtn=$('send'),modeEl=$('mode');
const store={get(k){try{return localStorage.getItem(k)}catch(_){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(_){}},del(k){try{localStorage.removeItem(k)}catch(_){}}};

async function api(path,body,method){
 const o={method:method||(body!==undefined?'POST':'GET'),headers:{'content-type':'application/json'}};
 if(token)o.headers.authorization='Bearer '+token;
 if(body!==undefined)o.body=JSON.stringify(body);
 const c=new AbortController(),tm=setTimeout(()=>c.abort(),path==='/otp'?45000:15000);o.signal=c.signal;
 let r;try{r=await fetch(API+path,o);}catch(e){throw Object.assign(new Error('NET'),{code:'NETWORK_ERROR'});}finally{clearTimeout(tm);}
 const j=await r.json().catch(()=>({}));
 if(!r.ok)throw Object.assign(new Error(j.error||'ERR'),{code:j.error,status:r.status,retryAfterSeconds:j.retryAfterSeconds});
 return j;
}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const SITE_LINK=/https?:\/\/(?:www\.)?(?:geomasterkz\.com|beeline\.pages\.dev)\/?\S*/gi;
function fmt(text){
 let s=esc(String(text||'').replace(SITE_LINK,'⟦PICK⟧'));
 s=s.replace(/\*([^*\n]+)\*/g,'<b>$1</b>');
 s=s.replace(/(https?:\/\/[^\s<]+)/g,u=>`<a href="${u}" target="_blank" rel="noopener">${u.replace(/^https?:\/\//,'')}</a>`);
 s=s.replace(/\n?⟦PICK⟧/g,'');
 return s.trim();
}
const hhmm=d=>{const x=new Date(d);return isNaN(x)?'':x.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit',timeZone:'Asia/Almaty'});};
const phone8=p=>{const d=String(p||'').replace(/\D/g,'').slice(-10);return d?'8'+d:'';};
const pkgGb=id=>{const p=(ctx?.availablePackages||[]).find(x=>x.id===id);return p?p.trafficGb:(String(id).match(/\d+/)||[''])[0];};

function addMsg(role,text,at,opts={}){
 const el=document.createElement('div');el.className='msg '+(role==='user'?'me':'bot');
 el.innerHTML=fmt(text)+`<span class="tm">${esc(hhmm(at||Date.now()))}</span>`;
 const card=log.querySelector('.card'),typing=log.querySelector('.typing'),before=typing||card||null;
 // the first bubble of a run gets the little tail, like in the messenger
 const prev=(before?before.previousElementSibling:log.lastElementChild);
 if(!prev||!prev.classList.contains('msg')||prev.classList.contains('me')!==(role==='user'))el.classList.add('first');
 log.insertBefore(el,before);
 return el;
}
function scrollEnd(){requestAnimationFrame(()=>{log.scrollTop=log.scrollHeight;});}
function setTyping(on){
 let el=log.querySelector('.typing');
 if(on&&!el){el=document.createElement('div');el.className='typing';el.innerHTML='<i></i><i></i><i></i>';log.insertBefore(el,log.querySelector('.card'));$('sub').textContent=t('typing');scrollEnd();}
 if(!on&&el){el.remove();$('sub').textContent=t('sub');}
}

// ---------- the live order card ----------
function activeOrder(){
 const os=ctx?.orders||[];const mine=store.get('gm_watching_order');
 return (mine&&os.find(o=>o.orderId===mine))||os.find(o=>['PAID','TRAINING','PROVISIONING'].includes(o.orderStatus)||o.jobStatus==='WAITING_OTP')||null;
}
function stage(){
 if(!ctx)return'loading';
 const s=ctx.clientState,o=activeOrder();
 if(o&&(o.jobStatus==='WAITING_OTP'||s==='WAITING_OTP'))return'otp';
 if(s==='WAITING_OTP')return'otp';
 if(s==='WAITING_PHONE')return'phone';
 if(s==='WAITING_PAYMENT'||s==='PAYMENT_PENDING')return'pay';
 if(o&&['PAID','TRAINING','PROVISIONING'].includes(o.orderStatus))return'conn';
 if(['TRAINING','PROVISIONING','PAYMENT_CONFIRMED'].includes(s))return'conn';
 const mine=store.get('gm_watching_order'),lo=ctx.lastOrder;
 if(mine&&lo&&lo.id===mine){if(lo.status==='COMPLETED')return'done';if(['TRAINING_FAILED','AUTH_FAILED','MANUAL_REVIEW','PAYMENT_FAILED'].includes(lo.status))return'fail';}
 return'choose';
}
function renderCard(force){
 const st=stage(),o=activeOrder();
 const key=[st,lang,ctx?.paymentUrl||'',o?.orderId||'',o?.targetPhone||'',otpError,otpNote,busy].join('|');
 if(!force&&key===cardKey)return;cardKey=key;
 let el=log.querySelector('.card');if(!el){el=document.createElement('div');el.className='card';log.appendChild(el);}
 const pk=ctx?.availablePackages||[];
 // a bot message (body) with its reply buttons underneath (acts)
 let body='',acts='';
 const errLine=otpError?`<div class="err">${esc(otpError)}</div>`:'';
 if(st==='choose'){
  body=`<h3>${esc(t('choose'))}</h3><p>${esc(t('choose_p'))}</p>`;
  acts=pk.map(p=>`<button class="btn${p.trafficGb>=20?' main':''}" data-pkg="${esc(p.id)}">${p.trafficGb>=20?'🔥':'🚀'} ${esc(p.trafficGb)} ГБ — ${esc(Number(p.price).toLocaleString('ru-RU'))} ₸</button>`).join('');
 }else if(st==='phone'){
  const sp=ctx.selectedPackage;body=`<h3>${esc(t('phone_t'))}</h3><p>${sp?esc(pkgGb(sp.id||sp)+' ГБ — '+Number(sp.price||0).toLocaleString('ru-RU')+' ₸\n'):''}${esc(t('phone_p'))}</p>${errLine}`;
  acts=`<button class="btn" data-backpkg>${esc(t('other_pkg'))}</button>`;
 }else if(st==='pay'){
  const sp=ctx.selectedPackage,amt=sp?.price||'',ph=phone8(ctx.lastOrder?.targetPhone||ctx.client?.phone);
  body=`<p>${esc(t('pay_t'))}</p><div class="big">${esc(Number(amt).toLocaleString('ru-RU'))} ₸</div><p>${esc((sp?pkgGb(sp.id||sp)+' ГБ → ':'')+ph)}</p>${ctx.paymentUrl?`<p>${esc(t('pay_wait'))}</p>`:''}${errLine}`;
  acts=(ctx.paymentUrl?`<a class="btn kaspi" href="${esc(ctx.paymentUrl)}" target="_blank" rel="noopener">${esc(t('pay_again'))}</a>`:`<button class="btn kaspi" data-pay ${busy?'disabled':''}>${esc(t('pay_btn'))}</button>`)+`<button class="btn" data-backphone>${esc(t('pay_change'))}</button>`;
 }else if(st==='otp'){
  const ph=phone8(o?.targetPhone||ctx.client?.phone);
  body=`<h3>${esc(t('otp_t'))}</h3><p>${esc(t('otp_p',ph))}</p>${otpNote?`<div class="okline">${esc(otpNote)}</div>`:''}${errLine}`;
  acts=`<button class="btn" data-resend ${busy?'disabled':''}>${esc(t('otp_new'))}</button>`;
 }else if(st==='conn'){
  body=`<h3>${esc(t('conn_t'))}</h3><p>${esc(t('conn_p'))}</p>`;
 }else if(st==='done'){
  const lo=ctx.lastOrder;body=`<h3 class="okline">${esc(t('done_t',pkgGb(lo.packageId)))}</h3><p>${esc(t('done_p',phone8(lo.targetPhone)))}</p>`;
  acts=`<button class="btn main" data-more>${esc(t('more'))}</button>`;
 }else if(st==='fail'){
  body=`<h3>${esc(t('fail_t'))}</h3><p>${esc(t('fail_p'))}</p>`;
  acts=`<button class="btn" data-more>${esc(t('more'))}</button>`;
 }
 if(body&&!ctx?.telegramLinked&&ctx?.telegramStart&&['otp','conn','pay'].includes(st))acts+=`<a class="btn" href="https://t.me/${TG_BOT}?start=${encodeURIComponent(ctx.telegramStart)}" target="_blank" rel="noopener">✈️ ${esc(t('tg'))}</a>`;
 el.innerHTML=body?`<div class="body">${body}</div>${acts?`<div class="acts">${acts}</div>`:''}`:'';el.hidden=!body;
 // composer mode follows the card
 const m=st==='phone'?'phone':st==='otp'?'code':'';
 modeEl.hidden=!m;modeEl.textContent=m==='phone'?t('m_phone'):m==='code'?t('m_code'):'';
 inp.placeholder=m==='phone'?t('ph_phone'):m==='code'?t('ph_code'):t('ph');
 inp.inputMode=m?'numeric':'text';
 scrollEnd();
}
log.addEventListener('click',async e=>{
 const b=e.target.closest('button,a');if(!b)return;
 if(b.dataset.pkg){await act(()=>api('/package',{packageId:b.dataset.pkg}));}
 else if(b.hasAttribute('data-pay')){await pay();}
 else if(b.hasAttribute('data-backphone')){await act(()=>api('/back-to-phone',{}));}
 else if(b.hasAttribute('data-backpkg')){await act(()=>api('/back-to-packages',{}));}
 else if(b.hasAttribute('data-resend')){otpError='';otpNote='';busy=true;renderCard();try{await api('/otp-resend',{});otpNote=t('otp_sent');}catch(err){otpError=err.code==='OTP_RATE_LIMITED'?t('otp_wait',mins(err.retryAfterSeconds)):t('e_net');}busy=false;renderCard();}
 else if(b.hasAttribute('data-more')){store.del('gm_watching_order');doneShownFor=null;if(['ACTIVE','COMPLETED'].includes(ctx.clientState)){renderCard(true);}else await refresh();cardKey='';renderCard(true);}
 else if(b.hasAttribute('data-pick')){renderCard(true);}
});
const mins=s=>{s=Number(s)||60;return s>=60?Math.ceil(s/60)+(lang==='ru'?' мин':' мин'):s+(lang==='ru'?' сек':' сек');};
async function act(fn){if(busy)return;busy=true;otpError='';renderCard();try{const r=await fn();if(r&&r.clientState)ctx={...ctx,...r};else await refresh();}catch(e){otpError=errText(e);await refresh().catch(()=>{});}busy=false;renderCard(true);}
function errText(e){if(e.code==='DAILY_PHONE_LIMIT')return t('e_limit');if(['INVALID_PHONE','PHONE_NOT_ALLOWED'].includes(e.code))return t('e_phone');if(e.code==='NOT_BEELINE'||e.code==='PHONE_NOT_BEELINE')return t('e_beeline');return t('e_net');}
async function pay(){
 if(busy)return;busy=true;otpError='';renderCard();
 const tab=window.open('about:blank','_blank');
 try{const r=await api('/payment-method',{method:'KASPI_LINK'});await refresh();const url=r.paymentUrl||ctx.paymentUrl;if(!url)throw new Error('NO_LINK');
  if(tab)tab.location.replace(url);else location.assign(url);}
 catch(e){if(tab)tab.close();if(e.code==='PAYMENT_METHOD_NOT_EXPECTED'){await refresh().catch(()=>{});}else otpError=t('e_net');}
 busy=false;renderCard(true);
}
async function submitPhone(digits){
 await act(async()=>{const r=await api('/phone',{phone:'7'+digits});if(r.orderId)store.set('gm_watching_order',r.orderId);return r;});
}
async function submitCode(code){
 if(busy)return;busy=true;otpError='';otpNote=t('otp_check');renderCard();
 try{const r=await api('/otp',{code});ctx={...ctx,...r};otpNote='';}
 catch(e){otpNote='';if(e.code==='OTP_NOT_EXPECTED'){}else if(e.code==='OTP_RATE_LIMITED')otpError=t('otp_wait',mins(e.retryAfterSeconds));else if(e.code==='OTP_REJECTED_RESENT'){otpNote=t('otp_sent');otpError=t('otp_bad');}else if(e.code==='OTP_REJECTED'||e.code==='INVALID_OTP_FORMAT')otpError=t('otp_bad');else otpError=t('e_net');await refresh().catch(()=>{});}
 busy=false;renderCard(true);
}

// ---------- composer ----------
function autosize(){inp.style.height='auto';inp.style.height=Math.min(inp.scrollHeight,120)+'px';}
inp.addEventListener('input',autosize);
inp.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!/Mobi|Android/i.test(navigator.userAgent)){e.preventDefault();send();}});
sendBtn.addEventListener('click',send);
async function send(){
 const text=inp.value.trim();if(!text||!token)return;
 const st=stage(),digits=text.replace(/\D/g,'');
 // a phone number while we wait for one, an SMS code while we wait for it - everything else goes to the AI
 if(st==='phone'&&digits.length>=10&&digits.length<=12&&!/[a-zа-яәіңғүұқөһ]/i.test(text)){inp.value='';autosize();addMsg('user',text);await submitPhone(digits.slice(-10));return;}
 if(st==='otp'&&/^\d{4,8}$/.test(digits)&&digits.length===text.replace(/\s/g,'').length){inp.value='';autosize();addMsg('user',text);await submitCode(digits);return;}
 inp.value='';autosize();
 const el=addMsg('user',text);el.dataset.local='1';scrollEnd();
 waitingReply=true;waitSince=Date.now();setTimeout(()=>{if(waitingReply)setTyping(true);},900);
 try{await api('/chat',{text});}catch(e){waitingReply=false;setTyping(false);el.style.opacity='.55';el.title=t('e_net');}
 schedule(1500);
}

// ---------- polling ----------
let pollT=null,failCount=0;
function schedule(ms){clearTimeout(pollT);pollT=setTimeout(tick,ms);}
async function pullMessages(){
 const r=await api('/chat?after='+lastId,undefined,'GET');
 for(const m of r.messages||[]){
  lastId=Math.max(lastId,m.id);
  if(m.role==='user'){const local=[...log.querySelectorAll('.msg.me[data-local="1"]')].find(x=>x.textContent.startsWith(m.text.trim().slice(0,40)));if(local){local.dataset.local='0';continue;}
   if(/^\d{4,8}$/.test(m.text.trim()))continue;}
  if(m.role==='assistant'){waitingReply=false;setTyping(false);}
  addMsg(m.role,m.text,m.at);
 }
 if((r.messages||[]).length)scrollEnd();
}
async function refresh(){ctx=await api('/status',undefined,'GET');}
async function tick(){
 try{await Promise.all([pullMessages(),refresh()]);failCount=0;$('offline').hidden=true;renderCard();}
 catch(e){if(e.status===401){await start();return;}failCount++;if(failCount>2){$('offline').textContent=t('offline');$('offline').hidden=false;}}
 if(waitingReply&&Date.now()-waitSince>45000){waitingReply=false;setTyping(false);}
 const st=stage(),fast=waitingReply||['pay','otp','conn'].includes(st);
 schedule(document.hidden?15000:fast?2500:6000);
}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)schedule(100);});

// ---------- start ----------
function applyLang(){
 document.documentElement.lang=lang;$('sub').textContent=t('sub');
 document.querySelectorAll('#langBox button').forEach(b=>b.classList.toggle('on',b.dataset.l===lang));
 const hello=log.querySelector('[data-hello]');if(hello)hello.innerHTML=fmt(t('hello'))+'<span class="tm"></span>';
 renderCard(true);
}
$('langBox').addEventListener('click',async e=>{const b=e.target.closest('button');if(!b||b.dataset.l===lang)return;lang=b.dataset.l;store.set('gm_lang',lang);applyLang();if(token)api('/language',{language:lang}).catch(()=>{});});
async function start(){
 const q=new URLSearchParams(location.search),body={language:lang};
 const tk=q.get('t');if(tk)body.token=tk;else{const w=store.get('gm_web_id');if(w)body.webId=w;}
 const src=q.get('src');if(src&&/^[a-z0-9_-]{1,32}$/i.test(src))body.src=src;else body.src='chat';
 try{
  const r=await api('/session',body);
  if(r.webId)store.set('gm_web_id',r.webId);
  token=r.sessionToken;ctx=r.context;ctx.telegramStart=r.telegramStart||null;
  if(ctx.client?.language&&STR[ctx.client.language]&&!store.get('gm_lang')){lang=ctx.client.language;}
  if(r.telegramStart)ctx.telegramStart=r.telegramStart;
  applyLang();
  await pullMessages().catch(()=>{});
  renderCard(true);schedule(2500);
 }catch(e){$('offline').textContent=t('offline');$('offline').hidden=false;setTimeout(start,4000);}
}
(function boot(){
 const d=document.createElement('div');d.className='day';d.textContent=t('today');log.appendChild(d);
 const h=document.createElement('div');h.className='msg bot first';h.dataset.hello='1';h.innerHTML=fmt(t('hello'))+'<span class="tm"></span>';log.appendChild(h);
 applyLang();start();
})();
// keep telegramStart across status refreshes
const _refresh=refresh;refresh=async function(){const ts=ctx?.telegramStart;await _refresh();if(ctx&&ts&&!ctx.telegramStart)ctx.telegramStart=ts;};
</script>
</body>
