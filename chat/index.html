<!doctype html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<title>GeoMaster чат</title>
<meta name="description" content="GeoMaster — Beeline-ға арзан интернет. Чатта жазыңыз, бот бірден жауап береді.">
<meta name="theme-color" content="#008069">
<meta name="robots" content="noindex">
<style>
/* Owner request (2026-10-21): our own web chat - the same AI seller as the Telegram bot, nothing to ban.
   Looks like the messenger people already know (owner: "чтобы деды не запутались"), under our own name -
   no third-party logo or name anywhere. Lives next to the site (/chat/) and shares its browser identity. */
:root{
 --hdr:#008069;--hdr-ink:#ffffff;--wall:#efeae2;--dot:rgba(0,0,0,.035);
 --in:#ffffff;--out:#d9fdd3;--ink:#111b21;--dim:#667781;--tick:#53bdeb;
 --green:#00a884;--link:#027eb5;--line:#e9edef;--chip:#ffffff;--bad:#d4442c;
 --bar:#f0f2f5;--field:#ffffff;--shadow:0 1px .5px rgba(11,20,26,.13);
}
@media (prefers-color-scheme: dark){
 :root:not([data-theme="light"]){
  --hdr:#202c33;--hdr-ink:#e9edef;--wall:#0b141a;--dot:rgba(255,255,255,.025);
  --in:#202c33;--out:#005c4b;--ink:#e9edef;--dim:#8696a0;--link:#53bdeb;--line:#2a3942;--chip:#202c33;
  --bar:#202c33;--field:#2a3942;--shadow:0 1px .5px rgba(0,0,0,.4);
 }
}
:root[data-theme="dark"]{
 --hdr:#202c33;--hdr-ink:#e9edef;--wall:#0b141a;--dot:rgba(255,255,255,.025);
 --in:#202c33;--out:#005c4b;--ink:#e9edef;--dim:#8696a0;--link:#53bdeb;--line:#2a3942;--chip:#202c33;
 --bar:#202c33;--field:#2a3942;--shadow:0 1px .5px rgba(0,0,0,.4);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{overflow-x:hidden;background:var(--wall);color:var(--ink);font:400 15.5px/1.38 "Segoe UI",Roboto,"Helvetica Neue",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
.app{display:flex;flex-direction:column;height:100dvh;width:100%;max-width:560px;margin:0 auto;overflow:hidden;position:relative;
 background-color:var(--wall);background-image:radial-gradient(var(--dot) 1.2px,transparent 1.3px),radial-gradient(var(--dot) 1.2px,transparent 1.3px);background-size:22px 22px;background-position:0 0,11px 11px}
header{display:flex;align-items:center;gap:10px;padding:8px 10px;padding-top:max(8px,env(safe-area-inset-top));background:var(--hdr);color:var(--hdr-ink);flex:none;min-height:58px}
.ava{width:40px;height:40px;border-radius:50%;background:#ffd528;display:grid;place-items:center;flex:none}
.ava svg{width:58%;height:58%;fill:#171714}
.who{flex:1;min-width:0}.who b{display:block;font-weight:600;font-size:17px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who small{display:block;font-size:13px;line-height:1.3;opacity:.85}
.lang{display:flex;gap:2px}
.lang button{border:1px solid rgba(255,255,255,.35);background:transparent;color:var(--hdr-ink);font:600 12px "Segoe UI",Roboto,Arial,sans-serif;padding:5px 8px;border-radius:14px;cursor:pointer;opacity:.75}
.lang button.on{background:rgba(255,255,255,.22);opacity:1}
#log{flex:1;min-height:0;overflow-y:auto;padding:10px 4.5% 6px;display:flex;flex-direction:column;gap:2px;overscroll-behavior:contain}
.day{align-self:center;background:var(--chip);color:var(--dim);font-size:12.5px;padding:5px 12px;border-radius:7.5px;margin:6px 0 8px;box-shadow:var(--shadow);text-transform:uppercase}
.msg{max-width:85%;padding:6px 7px 8px 9px;border-radius:7.5px;box-shadow:var(--shadow);white-space:pre-wrap;overflow-wrap:anywhere;position:relative;color:var(--ink)}
.msg .tm{float:right;margin:8px 0 -6px 10px;font-size:11px;color:var(--dim);line-height:1;white-space:nowrap}
.msg.me .tm::after{content:" ✓✓";color:var(--tick);letter-spacing:-3px}
.msg.bot{align-self:flex-start;background:var(--in)}
.msg.me{align-self:flex-end;background:var(--out)}
.msg.bot.first{border-top-left-radius:0;margin-top:6px}
.msg.me.first{border-top-right-radius:0;margin-top:6px}
.msg.bot.first::before{content:"";position:absolute;left:-8px;top:0;border-top:0 solid transparent;border-right:8px solid var(--in);border-bottom:10px solid transparent}
.msg.me.first::before{content:"";position:absolute;right:-8px;top:0;border-left:8px solid var(--out);border-bottom:10px solid transparent}
.msg a{color:var(--link);text-decoration:none}
.msg b{font-weight:700}
.linkbtn{display:block;margin:8px -2px 2px;padding:10px 12px;border-radius:8px;background:var(--green);color:#fff !important;font-weight:700;text-align:center;text-decoration:none}
.msg.me .linkbtn{background:#fff;color:var(--green) !important}
.typing{align-self:flex-start;background:var(--in);border-radius:7.5px;border-top-left-radius:0;padding:11px 13px;box-shadow:var(--shadow);display:flex;gap:4px;margin-top:6px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--dim);animation:blink 1.2s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,60%,100%{opacity:.25}30%{opacity:1}}
/* the live order card - a bot message with reply buttons under it, like an interactive message */
.card{align-self:flex-start;width:85%;max-width:360px;min-width:0;margin-top:6px;background:var(--in);color:var(--ink);border-radius:7.5px;border-top-left-radius:0;box-shadow:var(--shadow);overflow:hidden}
.card[hidden]{display:none}
.card .body{padding:8px 10px 9px;display:flex;flex-direction:column;gap:6px}
.card h3{font-weight:700;font-size:15.5px;line-height:1.3}
.card p{color:var(--dim);font-size:14px;white-space:pre-line}
.card .big{font-weight:700;font-size:24px;color:var(--ink)}
.acts{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.acts > *{border-top:1px solid var(--line)}.acts > *:first-child{border-top:0}
.btn{appearance:none;border:0;background:transparent;color:var(--link);font:500 15.5px/1.3 "Segoe UI",Roboto,Arial,sans-serif;padding:12px 10px;text-align:center;cursor:pointer;text-decoration:none;display:block;width:100%}
.btn.main{color:var(--green);font-weight:700}
.btn.kaspi{background:#f14635;color:#fff;font-weight:700}
.btn:disabled{opacity:.45;cursor:default}
.btn .sub{color:var(--dim);font-size:13px;margin-left:4px}
.err{color:var(--bad);font-weight:600;font-size:14px}
.okline{color:var(--green);font-weight:700}
footer{flex:none;display:flex;gap:6px;align-items:flex-end;padding:6px 6px;padding-bottom:max(6px,env(safe-area-inset-bottom));background:transparent}
.field{flex:1;min-width:0;background:var(--field);border-radius:24px;box-shadow:var(--shadow);display:flex;align-items:center;padding:0 8px 0 14px;min-height:48px}
.field textarea{flex:1;min-width:0;width:100%;border:0;outline:0;background:transparent;color:var(--ink);font:400 16.5px/1.35 "Segoe UI",Roboto,Arial,sans-serif;resize:none;max-height:120px;padding:12px 0}
.field textarea::placeholder{color:var(--dim)}
.mode{font:700 11px "Segoe UI",Roboto,Arial,sans-serif;letter-spacing:.03em;color:#fff;background:var(--green);border-radius:999px;padding:4px 8px;margin-right:6px;white-space:nowrap}
.send{width:48px;height:48px;border-radius:50%;border:0;background:var(--green);display:grid;place-items:center;cursor:pointer;flex:none;box-shadow:var(--shadow)}
.send svg{width:22px;height:22px;fill:#fff;margin-left:3px}
:where(button,a,textarea):focus-visible{outline:2px solid var(--link);outline-offset:2px}
.offline{position:absolute;top:66px;left:50%;transform:translateX(-50%);background:#111b21;color:#fff;font:600 12.5px "Segoe UI",Roboto,Arial,sans-serif;padding:6px 12px;border-radius:999px;z-index:3}
@media (prefers-reduced-motion:reduce){.typing i{animation:none}}
</style>
</head>
<body>
<div class="app">
 <header>
  <div class="ava" aria-hidden="true"><svg viewBox="0 0 32 32"><rect x="6" y="19" width="4" height="7" rx="1.5"/><rect x="12" y="15" width="4" height="11" rx="1.5"/><rect x="18" y="10" width="4" height="16" rx="1.5"/><rect x="24" y="5" width="4" height="21" rx="1.5"/></svg></div>
  <div class="who"><b>GeoMaster</b><small id="sub">желіде</small></div>
  <div class="lang" id="langBox"><button data-l="kk">ҚАЗ</button><button data-l="ru">РУС</button></div>
 </header>
 <div id="log" role="log" aria-live="polite"></div>
 <footer>
  <div class="field"><textarea id="inp" rows="1" maxlength="1000"></textarea></div>
  <button class="send" id="send" aria-label="Send"><svg viewBox="0 0 24 24"><path d="M3.4 20.4 21 12 3.4 3.6 3.4 10.2 15 12 3.4 13.8z"/></svg></button>
 </footer>
 <div class="offline" id="offline" hidden></div>
</div>
<script>
'use strict';
// Owner request (2026-10-21): a plain conversation - the bot writes, the customer writes. The AI answers
// questions (server); the order steps the customer starts by writing ("10", his number, the SMS code) are
// done right here and confirmed with a bot message; after payment the server itself writes the next steps.
const API='/api';
const STR={
 kk:{sub:'желіде',typing:'жазып жатыр…',ph:'Хабарлама',today:'Бүгін',offline:'Байланыс үзілді, қайта қосылуда…',
  hello:'Сәлеметсіз бе! 👋 GeoMaster — Beeline-ға арзан интернет.\n\n🚀 10 ГБ — 500 ₸\n🔥 20 ГБ — 1 000 ₸\n📅 30 күн · тариф өзгермейді\n\nҚай пакетті қосамыз? Осында *10* немесе *20* деп жазыңыз 🙂',
  ask_phone:(g,p)=>`Жарайды, ${g} ГБ — ${p} ₸ 👍\nҚай Beeline нөміріне қосамыз? Нөмірді жазыңыз.`,
  pay:(g,ph)=>`${g} ГБ → ${ph} ✅\nТөлеу үшін төмендегі сілтемені басыңыз 👇\nKaspi-де төлеген соң осы чатқа қайтыңыз — қалғаны осында.`,
  pay_btn:p=>`💳 Kaspi-де төлеу — ${p} ₸`,pay_fail:'Төлем сілтемесі дайындалмады 😕 «төлеу» деп жазыңыз — қайта жіберемін.',
  bad_phone:'Нөмір дұрыс емес сияқты. Beeline нөмірін толық жазыңыз, мысалы: 7771234567',
  limit:'Бұл нөмірге бүгінгі лимит бітті. Ертең қайталаңыз немесе басқа нөмір жазыңыз.',
  code_bad:'Код қате 😕 SMS-ті тексеріп, қайта жазыңыз.',code_resent:'Код сәйкес келмеді — Beeline жаңа код жіберді 📩 Жаңа кодты жазыңыз.',
  code_wait:m=>`Beeline жаңа кодты ${m} минуттан кейін жібереді. Сол кезде «жаңа код» деп жазыңыз.`,
  new_code:'Жаңа код жіберілді 📩 SMS келген соң кодты осында жазыңыз.',net:'Байланыс жоқ, қайта жазып көріңіз 🙏',
  pick:'📶 Пакет таңдау',pick_txt:'Қай пакет? Осында *10* немесе *20* деп жазыңыз 🙂',
  ask_kaspi:ph=>`Нөмір: ${ph} ✅\nТөлем — Kaspi шоты арқылы. Шотты қай Kaspi нөміріне жіберейін? Нөмірді жазыңыз.\n(Осы нөмір болса — «осы» деп жазыңыз)`,
  confirm:(n,k)=>`Kaspi: *${n}* (${k})\nДұрыс па? «иә» немесе «жоқ» деп жазыңыз.`,
  inv_sent:(k,a)=>`Шот жіберілді ✅ ${k} нөміріне, ${a} ₸.\nKaspi қосымшасы → Төлемдер → Шоттар → төлеңіз. Шот 30 минут жарамды.\nТөлеген соң осы чатқа қайтыңыз 🙂`,
  kaspi_nf:'Бұл нөмірге Kaspi табылмады 😕 Kaspi тіркелген нөмірді жазыңыз.',kaspi_bad:'Kaspi нөмірі дұрыс емес. Толық жазыңыз, мысалы: 7771234567',ask_again:'Жарайды 👍 Kaspi нөмірін қайта жазыңыз.',
  not_coming:ph=>`Код ${ph} нөміріне келеді. Нөмір дұрыс па?\n• Дұрыс болса — 1–2 минут күтіп, «жаңа код» деп жазыңыз.\n• Қате болса — дұрыс Beeline нөмірін осында жазыңыз.`,
  phone_changed:ph=>`Нөмір ${ph} болып өзгертілді ✅ Код енді осы нөмірге келеді — осында жазыңыз.`},
 ru:{sub:'в сети',typing:'печатает…',ph:'Сообщение',today:'Сегодня',offline:'Связь прервалась, переподключаемся…',
  hello:'Здравствуйте! 👋 GeoMaster — дешёвый интернет на Beeline.\n\n🚀 10 ГБ — 500 ₸\n🔥 20 ГБ — 1 000 ₸\n📅 30 дней · тариф не меняется\n\nКакой пакет подключаем? Напишите здесь *10* или *20* 🙂',
  ask_phone:(g,p)=>`Хорошо, ${g} ГБ — ${p} ₸ 👍\nНа какой номер Beeline подключаем? Напишите номер.`,
  pay:(g,ph)=>`${g} ГБ → ${ph} ✅\nДля оплаты нажмите на ссылку ниже 👇\nПосле оплаты в Kaspi вернитесь в этот чат — дальше всё здесь.`,
  pay_btn:p=>`💳 Оплатить в Kaspi — ${p} ₸`,pay_fail:'Не получилось подготовить ссылку на оплату 😕 Напишите «оплата» — пришлю снова.',
  bad_phone:'Похоже, номер неверный. Напишите номер Beeline полностью, например: 7771234567',
  limit:'На этот номер на сегодня лимит. Попробуйте завтра или напишите другой номер.',
  code_bad:'Код неверный 😕 Проверьте SMS и напишите ещё раз.',code_resent:'Код не подошёл — Beeline прислал новый 📩 Напишите новый код.',
  code_wait:m=>`Beeline пришлёт новый код через ${m} мин. Тогда напишите «новый код».`,
  new_code:'Новый код отправлен 📩 Как придёт SMS — напишите код здесь.',net:'Нет связи, попробуйте написать ещё раз 🙏',
  pick:'📶 Выбрать пакет',pick_txt:'Какой пакет? Напишите здесь *10* или *20* 🙂',
  ask_kaspi:ph=>`Номер: ${ph} ✅\nОплата — счётом в Kaspi. На какой номер Kaspi отправить счёт? Напишите номер.\n(Если этот же — напишите «этот»)`,
  confirm:(n,k)=>`Kaspi: *${n}* (${k})\nВсё верно? Напишите «да» или «нет».`,
  inv_sent:(k,a)=>`Счёт отправлен ✅ на ${k}, ${a} ₸.\nПриложение Kaspi → Платежи → Счета → оплатите. Счёт действует 30 минут.\nПосле оплаты вернитесь в этот чат 🙂`,
  kaspi_nf:'На этот номер Kaspi не найден 😕 Напишите номер, на который зарегистрирован Kaspi.',kaspi_bad:'Неверный номер Kaspi. Напишите полностью, например: 7771234567',ask_again:'Хорошо 👍 Напишите номер Kaspi ещё раз.',
  not_coming:ph=>`Код приходит на номер ${ph}. Номер верный?\n• Если верный — подождите 1–2 минуты и напишите «новый код».\n• Если нет — напишите здесь правильный номер Beeline.`,
  phone_changed:ph=>`Номер изменён на ${ph} ✅ Код теперь придёт на этот номер — напишите его здесь.`}
};
const store={get(k){try{return localStorage.getItem(k)}catch(_){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(_){}},del(k){try{localStorage.removeItem(k)}catch(_){}}};
let lang=store.get('gm_lang');if(!STR[lang])lang='kk';
const t=(k,...a)=>{const v=STR[lang][k];return typeof v==='function'?v(...a):v;};
const $=id=>document.getElementById(id);
const log=$('log'),inp=$('inp');
let token=null,ctx=null,webId=null,lastId=0,server=[],local=[],waiting=false,waitSince=0,busy=false;

async function api(path,body,method){
 const o={method:method||(body!==undefined?'POST':'GET'),headers:{'content-type':'application/json'}};
 if(token)o.headers.authorization='Bearer '+token;
 if(body!==undefined)o.body=JSON.stringify(body);
 const c=new AbortController(),tm=setTimeout(()=>c.abort(),path==='/otp'?45000:15000);o.signal=c.signal;
 let r;try{r=await fetch(API+path,o);}catch(e){throw Object.assign(new Error('NET'),{code:'NETWORK_ERROR'});}finally{clearTimeout(tm);}
 const j=await r.json().catch(()=>({}));
 if(!r.ok)throw Object.assign(new Error(j.error||'ERR'),{code:j.error,status:r.status,retryAfterSeconds:j.retryAfterSeconds});
 return j;
}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const SITE_LINK=/https?:\/\/(?:www\.)?(?:geomasterkz\.com|beeline\.pages\.dev)\/?[^\s]*/gi;
// text -> html: *bold*, links; a link to our own site becomes a "choose a package" button (ordering happens here)
function fmt(text){
 let s=esc(String(text||'').replace(SITE_LINK,'\u0001'));
 s=s.replace(/\*([^*\n]+)\*/g,'<b>$1</b>');
 s=s.replace(/(https?:\/\/[^\s<]+)/g,u=>`<a href="${u}" target="_blank" rel="noopener">${u.replace(/^https?:\/\//,'')}</a>`);
 s=s.replace(/\n?\u0001/g,`<a class="linkbtn" href="#" data-pick>${esc(t('pick'))}</a>`);
 return s.trim();
}
const hhmm=d=>{const x=new Date(d);return isNaN(x)?'':x.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit',timeZone:'Asia/Almaty'});};
const phone8=p=>{const d=String(p||'').replace(/\D/g,'').slice(-10);return d?'8'+d:'';};
const money=n=>Number(n||0).toLocaleString('ru-RU');
const pkgOf=id=>(ctx?.availablePackages||[]).find(x=>x.id===id)||null;

// ---------- messages: the server transcript + this chat's own step messages, by time ----------
const LKEY='gm_chat_local';
function loadLocal(){try{const j=JSON.parse(store.get(LKEY)||'{}');local=j.w===webId?j.m||[]:[];}catch(_){local=[];}}
function saveLocal(){store.set(LKEY,JSON.stringify({w:webId,m:local.slice(-80)}));}
function say(text,extra={},key){ // a bot step message, once per key
 if(key&&local.some(m=>m.key===key))return;
 local.push({role:'assistant',text,at:Date.now(),key:key||null,...extra});saveLocal();draw();
}
function mine(text){local.push({role:'user',text,at:Date.now(),local:true});saveLocal();draw();}
function draw(){
 const all=[...server.map(m=>({...m,at:new Date(m.at).getTime()})),...local].sort((a,b)=>a.at-b.at);
 let h=`<div class="day">${esc(t('today'))}</div><div class="msg bot first">${fmt(t('hello'))}<span class="tm"></span></div>`,prev='assistant';
 for(const m of all){
  const me=m.role==='user';
  const first=(me?'user':'assistant')!==prev;prev=me?'user':'assistant';
  const btn=m.href?`<a class="linkbtn" href="${esc(m.href)}" target="_blank" rel="noopener">${esc(m.btn)}</a>`:'';
  h+=`<div class="msg ${me?'me':'bot'}${first?' first':''}">${fmt(m.text)}${btn}<span class="tm">${esc(hhmm(m.at))}</span></div>`;
 }
 if(waiting)h+='<div class="typing"><i></i><i></i><i></i></div>';
 const atBottom=log.scrollHeight-log.scrollTop-log.clientHeight<80;
 log.innerHTML=h;$('sub').textContent=waiting?t('typing'):t('sub');
 if(atBottom||waiting)requestAnimationFrame(()=>{log.scrollTop=log.scrollHeight;});
}
log.addEventListener('click',e=>{const a=e.target.closest('[data-pick]');if(!a)return;e.preventDefault();say(t('pick_txt'));inp.focus();});

// ---------- where the order is ----------
function liveOrder(){const os=ctx?.orders||[];const w=store.get('gm_watching_order');return(w&&os.find(o=>o.orderId===w))||os.find(o=>['PAID','TRAINING','PROVISIONING'].includes(o.orderStatus)||o.jobStatus==='WAITING_OTP')||null;}
function stage(){
 if(!ctx)return'';
 const s=ctx.clientState,o=liveOrder();
 if(s==='WAITING_OTP'||o?.jobStatus==='WAITING_OTP')return'otp';
 if(s==='WAITING_PHONE')return'phone';
 if(s==='WAITING_PAYMENT'||s==='PAYMENT_PENDING')return'pay';
 if(o)return'busy';
 return'free';
}
// payment: a Kaspi invoice to the number the customer names (checked by name first); a Kaspi link on request
let pendingKaspi=null;
const targetOf=()=>ctx?.lastOrder?.targetPhone||liveOrder()?.targetPhone||ctx?.client?.phone;
async function ensurePayStep(){
 if(stage()!=='pay'||busy)return;
 const o=ctx.lastOrder,sp=ctx.selectedPackage||pkgOf(o?.packageId),oid=o?.id||'';
 if(ctx.paymentStatus==='PAYMENT_PENDING'&&ctx.paymentMethod==='KASPI'){say(t('inv_sent',phone8(ctx.paymentPhone||pendingKaspi?.phone||''),money(sp?.price||o?.amount)),{},'inv:'+oid);return;}
 if(ctx.paymentStatus==='PAYMENT_PENDING'&&ctx.paymentMethod==='KASPI_LINK'&&ctx.paymentUrl){say(t('pay',sp?.trafficGb||'',phone8(o?.targetPhone)),{href:ctx.paymentUrl,btn:t('pay_btn',money(sp?.price))},'pay:'+oid+':'+ctx.paymentUrl);return;}
 say(t('ask_kaspi',phone8(targetOf())),{},'askk:'+oid);
}
async function previewKaspi(d){
 busy=true;
 try{const r=await api('/payment-recipient',{method:'KASPI',paymentPhone:'7'+d});pendingKaspi={phone:'7'+d,name:r.clientName||''};say(t('confirm',pendingKaspi.name||'—',phone8(pendingKaspi.phone)));}
 catch(e){say(e.code==='KASPI_CLIENT_NOT_FOUND'?t('kaspi_nf'):e.code==='INVALID_KASPI_PHONE'?t('kaspi_bad'):t('net'));}
 busy=false;
}
async function sendInvoice(){
 const k=pendingKaspi;if(!k)return;busy=true;
 try{await api('/payment-method',{method:'KASPI',paymentPhone:k.phone});pendingKaspi=null;await refresh();const o=ctx.lastOrder,sp=ctx.selectedPackage||pkgOf(o?.packageId);say(t('inv_sent',phone8(k.phone),money(sp?.price||o?.amount)),{},'inv:'+(o?.id||''));}
 catch(e){if(e.code==='PAYMENT_METHOD_NOT_EXPECTED')await refresh().catch(()=>{});else say(e.code==='KASPI_CLIENT_NOT_FOUND'?t('kaspi_nf'):t('net'));}
 busy=false;
}
// ---------- the customer writes ----------
const PKG=/^\s*(?:(10|20)\s*(?:гб|gb|гиг\S*|г)?|(?:гб|gb)\s*(10|20))\s*(?:керек|алам\S*|давай|пожалуйста|please)?\s*[.!)]*\s*$/i;
const NEW_CODE=/(жаңа|жана|новый|еще|ещё|қайта)\s*(код|code)/i;
const NOT_COMING=/(келмед|келмей|келген жоқ|не приш|не прих|нет\s*код|код\s*жоқ|код\s*жок)/i;
const YES=/^\s*(иә|ия|иа|ыя|да|ага|ок|ok|дұрыс|дурыс|верно|правильно|\+|👍)/i,NO=/^\s*(жоқ|жок|нет|не\s|не$|қате|кате|неправильно|неверно)/i;
const SAME=/^\s*(осы|осы нөмір|сол|этот|тот же|этот же)\s*[.!]*\s*$/i;
async function send(){
 const text=inp.value.trim();if(!text||!token)return;
 inp.value='';autosize();
 const st=stage(),digits=text.replace(/\D/g,''),onlyDigits=/^[\d\s()+-]+$/.test(text);
 if(st==='otp'&&onlyDigits&&digits.length>=4&&digits.length<=8){mine(text);return submitCode(digits);}
 if(st==='otp'&&onlyDigits&&digits.length>=10&&digits.length<=12){mine(text);return changePhone(digits.slice(-10));}
 if(st==='otp'&&NEW_CODE.test(text)){mine(text);return resendCode();}
 if(st==='otp'&&NOT_COMING.test(text)){mine(text);return say(t('not_coming',phone8(targetOf())));}
 if(st==='phone'&&onlyDigits&&digits.length>=10&&digits.length<=12){mine(text);return submitPhone(digits.slice(-10));}
 if(st==='pay'&&pendingKaspi&&YES.test(text)){mine(text);return sendInvoice();}
 if(st==='pay'&&pendingKaspi&&NO.test(text)){mine(text);pendingKaspi=null;return say(t('ask_again'));}
 if(st==='pay'&&onlyDigits&&digits.length>=10&&digits.length<=12){mine(text);return previewKaspi(digits.slice(-10));}
 if(st==='pay'&&SAME.test(text)){mine(text);return previewKaspi(String(targetOf()||'').replace(/\D/g,'').slice(-10));}
 const pm=text.match(PKG);
 if(pm&&['free','phone'].includes(st)){mine(text);return choosePackage(pm[1]==='20'||pm[2]==='20'?20:10);}
 return askAi(text);
}
async function askAi(text){
 local.push({role:'user',text,at:Date.now(),local:true,pending:true});saveLocal();
 waiting=true;waitSince=Date.now();draw();
 try{await api('/chat',{text});}catch(e){waiting=false;say(t('net'));}
 schedule(1500);
}
async function choosePackage(gb){
 const p=(ctx?.availablePackages||[]).find(x=>Number(x.trafficGb)===gb);if(!p)return askAi(String(gb));
 busy=true;
 try{
  if(ctx.clientState!=='CHOOSING_PACKAGE'&&ctx.clientState!=='ACTIVE'&&ctx.clientState!=='COMPLETED'&&ctx.clientState!=='NEW')await api('/back-to-packages',{}).catch(()=>{});
  ctx={...ctx,...await api('/package',{packageId:p.id})};
  say(t('ask_phone',p.trafficGb,money(p.price)));
 }catch(e){say(t('net'));await refresh().catch(()=>{});}
 busy=false;
}
async function submitPhone(d){
 busy=true;
 try{const r=await api('/phone',{phone:'7'+d});if(r.orderId)store.set('gm_watching_order',r.orderId);ctx={...ctx,...r};busy=false;await ensurePayStep();}
 catch(e){busy=false;say(e.code==='DAILY_PHONE_LIMIT'?t('limit'):['INVALID_PHONE','PHONE_NOT_ALLOWED'].includes(e.code)?t('bad_phone'):t('net'));await refresh().catch(()=>{});}
}
async function submitCode(code){
 busy=true;waiting=true;draw();
 try{ctx={...ctx,...await api('/otp',{code})};}
 catch(e){
  if(e.code==='OTP_NOT_EXPECTED'){}
  else if(e.code==='OTP_REJECTED'||e.code==='INVALID_OTP_FORMAT')say(t('code_bad'));
  else if(e.code==='OTP_REJECTED_RESENT')say(t('code_resent'));
  else if(e.code==='OTP_RATE_LIMITED')say(t('code_wait',Math.max(1,Math.ceil((e.retryAfterSeconds||60)/60))));
  else say(t('net'));
  await refresh().catch(()=>{});
 }
 busy=false;waiting=false;draw();schedule(1500);
}
async function changePhone(d){
 busy=true;
 try{const r=await api('/change-phone',{phone:'7'+d});if(r.orderId)store.set('gm_watching_order',r.orderId);ctx={...ctx,...r};say(t('phone_changed',phone8('7'+d)));}
 catch(e){say(e.code==='DAILY_PHONE_LIMIT'?t('limit'):['INVALID_PHONE','PHONE_NOT_ALLOWED'].includes(e.code)?t('bad_phone'):t('net'));await refresh().catch(()=>{});}
 busy=false;
}
async function resendCode(){
 try{await api('/otp-resend',{});say(t('new_code'));}
 catch(e){say(e.code==='OTP_RATE_LIMITED'?t('code_wait',Math.max(1,Math.ceil((e.retryAfterSeconds||60)/60))):t('net'));}
}

// ---------- polling ----------
let pollT=null,fails=0;
function schedule(ms){clearTimeout(pollT);pollT=setTimeout(tick,ms);}
async function pull(){
 const r=await api('/chat?after='+lastId,undefined,'GET');let changed=false;
 for(const m of r.messages||[]){
  lastId=Math.max(lastId,m.id);
  if(m.role==='user'){const i=local.findIndex(x=>x.pending&&x.text.trim()===m.text.trim());if(i>=0){local.splice(i,1);saveLocal();}}
  if(m.role==='assistant')waiting=false;
  server.push(m);changed=true;
 }
 if(changed)draw();
}
async function refresh(){const ts=ctx?.telegramStart;ctx=await api('/status',undefined,'GET');if(ts)ctx.telegramStart=ts;}
async function tick(){
 try{await Promise.all([pull(),refresh()]);fails=0;$('offline').hidden=true;await ensurePayStep();}
 catch(e){if(e.status===401){return start();}if(++fails>2){$('offline').textContent=t('offline');$('offline').hidden=false;}}
 if(waiting&&Date.now()-waitSince>45000){waiting=false;draw();}
 const st=stage(),fast=waiting||['pay','otp','busy'].includes(st);
 schedule(document.hidden?15000:fast?2500:6000);
}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)schedule(100);});

// ---------- composer, language, start ----------
function autosize(){inp.style.height='auto';inp.style.height=Math.min(inp.scrollHeight,120)+'px';}
inp.addEventListener('input',autosize);
inp.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!/Mobi|Android/i.test(navigator.userAgent)){e.preventDefault();send();}});
$('send').addEventListener('click',send);
function applyLang(){
 document.documentElement.lang=lang;inp.placeholder=t('ph');
 document.querySelectorAll('#langBox button').forEach(b=>b.classList.toggle('on',b.dataset.l===lang));draw();
}
$('langBox').addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.dataset.l===lang)return;lang=b.dataset.l;store.set('gm_lang',lang);applyLang();if(token)api('/language',{language:lang}).catch(()=>{});});
async function start(){
 const q=new URLSearchParams(location.search),body={language:lang};
 const tk=q.get('t');if(tk)body.token=tk;else{const w=store.get('gm_web_id');if(w)body.webId=w;}
 const src=q.get('src');body.src=src&&/^[a-z0-9_-]{1,32}$/i.test(src)?src:'chat';
 try{
  const r=await api('/session',body);
  if(r.webId)store.set('gm_web_id',r.webId);webId=r.webId||store.get('gm_web_id')||'t';
  token=r.sessionToken;ctx=r.context;ctx.telegramStart=r.telegramStart||null;
  loadLocal();server=[];lastId=0;
  await pull().catch(()=>{});draw();schedule(800);
 }catch(e){$('offline').textContent=t('offline');$('offline').hidden=false;setTimeout(start,4000);}
}
applyLang();start();
</script>
