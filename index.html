// Phone input mask (2026-09-04): people paste their number from WhatsApp in every shape imaginable -
// with the leading 8 Kazakhstan habit ("8777..."), with a + ("+7777..."), or just the bare local part
// with no country code at all - so any run of 11 digits starting with 7 or 8 is treated as "country
// code included" and that leading digit is dropped, rather than making someone hunt for a stray digit
// to delete by hand. Capped at exactly 10 local digits either way.
function normalizePhoneDigits(raw){
 let digits = String(raw||'').replace(/\D/g,'');
 if(digits.length===11 && (digits[0]==='7'||digits[0]==='8')) digits = digits.slice(1);
 return digits.slice(0,10);
}
function formatPhoneDigits(digits){
 return[digits.slice(0,3),digits.slice(3,6),digits.slice(6,8),digits.slice(8,10)].filter(Boolean).join('-');
}
// The +7 prefix is its own static <span> next to the input (see the .phoneinput markup) - this only
// ever formats the 10 local digits, always fully re-derived from normalizePhoneDigits() so a mid-
// paste of an 11-digit number reformats correctly instead of just capping at 10 raw characters.
function bindPhoneMask(input){
 input.addEventListener('input', ()=>{ input.value = formatPhoneDigits(normalizePhoneDigits(input.value)); });
}
// Full stored phone (ctx.client.phone, e.g. "77770604701") displayed read-only, e.g. on the OTP screen -
// same "+7-XXX-XXX-XX-XX" grouping as the phone input mask above, just with the whole thing shown at
// once instead of split between a static "+7-" span and a live-typed field.
function formatFullPhoneDisplay(phone){
 return '+7-'+formatPhoneDigits(normalizePhoneDigits(phone));
}

// Live-run forensic fix (2026-09-08, round 5): confirmed live - a customer's very first /session call
// never resolved OR rejected, so the existing catch-driven "не удалось подключиться" fallback in
// initSession() never fired either - the page just sat blank below the static header forever, with
// zero requests ever reaching the server. A hard timeout guarantees every call eventually settles one
// way or the other, so a genuine stall now surfaces the same way a real network error already does.
async function apiOnce(path, body, method, timeoutMs){
 const opts = {method: method || (body!==undefined?'POST':'GET'), headers:{'content-type':'application/json'}};
 if(sessionToken) opts.headers.authorization = 'Bearer ' + sessionToken;
 if(body!==undefined) opts.body = JSON.stringify(body);
 const controller = new AbortController();
 const timeoutId = setTimeout(()=>controller.abort(), timeoutMs);
 opts.signal = controller.signal;
 let r;
 try{ r = await fetch(API_BASE + path, opts); }
 catch(e){ throw Object.assign(new Error('REQUEST_FAILED'), {code:'NETWORK_ERROR'}); }
 finally{ clearTimeout(timeoutId); }
 const j = await r.json().catch(()=>({}));
 if(!r.ok) throw Object.assign(new Error(j.error||'REQUEST_FAILED'), {code:j.error, status:r.status});
 return j;
}
// Live-run forensic fix (2026-09-08, round 6): confirmed live on two separate devices - the very first
// connection attempt can genuinely take longer than round 5's 15s timeout to succeed (mobile carriers
// often try IPv6 first and this server only advertises IPv4, so the fallback to IPv4 can be slow), and
// then the SAME request succeeds fine moments later with zero server-side changes. A 15s hard cutoff was
// killing connections that would have worked if given a bit more time. Retrying automatically - each
// attempt with its own generous timeout - lets that slow-but-working fallback path finish on its own
// without the customer needing to notice a failure and manually reload. Safe to retry any call here: the
// app already treats "this already happened" responses (PHONE_NOT_EXPECTED, OTP_NOT_EXPECTED, etc.) as
// a normal refresh-and-continue case, not an error, so a retry landing on an already-processed request
// can't leave the customer stuck.
async function api(path, body, method){
 // A healthy connection returns long before any of this matters - fetch() resolves as soon as the
 // server answers (confirmed live: well under a second for every working request today), so this
 // timeout is a ceiling for an ALREADY-broken connection, never an artificial delay on a working one.
 let lastErr;
 for(let attempt=0; attempt<3; attempt++){
  try{ return await apiOnce(path, body, method, 12000); }
  catch(e){
   lastErr = e;
   if(e.code!=='NETWORK_ERROR') throw e; // a real answer from the server - retrying won't change it
  }
 }
 throw lastErr;
}

async function initSession(){
 // Live-run forensic fix (2026-09-08, round 5): this overlay used to show only after a package click
 // failed to escape the in-app browser - confirmed live, a customer stuck in one of these webviews
 // never even gets that far if the FIRST /session call itself silently stalls there (no packages ever
 // render to click). Warning immediately, before any network call, means the customer sees actionable
 // instructions right away instead of a blank page with nothing to click.
 if(isInAppBrowser()) showBrowserEscapeOverlay();
 const tg = window.Telegram && window.Telegram.WebApp;
 let body;
 if(tg && tg.initData){
  tg.ready(); tg.expand();
  body = {initData: tg.initData, language: lang};
 } else {
  const params = new URLSearchParams(location.search);
  const token = params.get('t');
  if(token){ body = {token, language: lang}; }
  else{
   // Live-run UX fix (2026-09-04): a bare visit (no WhatsApp/Telegram link at all) is now a fully
   // supported, standalone entry point - not an error. First time, there's no stored webId yet, so
   // the backend mints one and hands it back (see the res.webId branch below); every later visit from
   // this same browser sends it back and resumes the same account.
   const webId = localStorage.getItem('gm_web_id');
   body = webId ? {webId, language: lang} : {language: lang};
  }
 }
 try{
  const res = await api('/session', body);
  if(res.paused){ showScreen('paused', {message:res.message}); return; }
  if(res.webId) localStorage.setItem('gm_web_id', res.webId);
  sessionToken = res.sessionToken; ctx = res.context;
  if(ctx.client && ctx.client.language) { lang = ctx.client.language; localStorage.setItem('gm_lang', lang); applyLang(); }
  render();
 }catch(e){ showScreen('noEntry'); }
}

async function refreshContext(){ ctx = await api('/status', undefined, 'GET'); }

// Parallel orders on different numbers (2026-09-07): the client is freed back to ACTIVE as soon as an
// order's training STARTS (not once it finishes - see backend TrainingEventHandler), so client.state
// alone can no longer tell this browser "is the order I just bought still going". This browser
// remembers which orderId it's watching; ctx.orders (order/job-status, independent of client.state)
// tells us whether that specific order is still genuinely in flight.
function rememberWatchedOrder(orderId){ localStorage.setItem('gm_watching_order', orderId); }
function watchedOrderId(){ return localStorage.getItem('gm_watching_order'); }
function forgetWatchedOrder(){ localStorage.removeItem('gm_watching_order'); }

function render(){
 if(!ctx) return;
 const state = ctx.clientState;
 if(['NEW','CHOOSING_PACKAGE'].includes(state)) return showScreen('packages');
 if(state==='WAITING_PHONE'){ engagedThisSession=true; return showScreen('phone'); }
 // Live-run forensic fix (2026-09-09, round 14): confirmed live - order.status flips CREATED->
 // PAYMENT_PENDING synchronously the instant submitPhone creates the payment link, well BEFORE the
 // customer has picked a bank at all - so ctx.paymentStatus is ALREADY 'PAYMENT_PENDING' by the time this
 // screen first renders after entering a phone number, not just once a bank is chosen as an earlier fix
 // here wrongly assumed. That earlier version of this check sent every customer straight to the
 // "checking payment" screen the instant they submitted their phone number, before ever seeing the
 // bank-choice buttons - confirmed live as a real, severe regression. ctx.paymentMethod (persisted by
 // OrderWorkflow.choosePaymentMethod, see ClientLifecycle.customerContext) is the real signal: null/absent
 // means no bank chosen yet (show 'receipt'); set means a bank IS chosen and a real payment is genuinely
 // in flight (show 'checking', same as the payment-method button already forces on the very first click -
 // now the poll agrees with it instead of overriding it). Survives a page reload, unlike a client-side-only
 // flag, since it's read straight off the order row.
 if(state==='WAITING_PAYMENT'){ engagedThisSession=true; return showScreen(ctx.paymentMethod ? 'checking' : 'receipt'); }
 if(state==='PAYMENT_CONFIRMED'){ engagedThisSession=true; return showScreen('checking'); }
 if(state==='WAITING_OTP'){ engagedThisSession=true; return showScreen('otp'); }
 if(['TRAINING','PROVISIONING'].includes(state)){ engagedThisSession=true; return showScreen('connected'); }
 // ACTIVE/COMPLETED means "free to act, nothing pending" on the backend either way - engagedThisSession
 // is what tells apart "I was just watching this order finish" (connected screen) from "fresh page
 // load, ready to order again" (packages screen) - see its own comment above.
 if(['ACTIVE','COMPLETED'].includes(state)){
  // Parallel orders on different numbers (2026-09-07): client.state now reads ACTIVE the instant
  // training STARTS, not once it finishes (the client is freed early so a second, different-numbered
  // order can begin) - so ACTIVE no longer means "this order is done". If the order THIS browser is
  // watching is still in ctx.orders (still genuinely PAID/TRAINING/PROVISIONING/etc), keep showing the
  // activating screen for it instead of jumping to success/packages early. Once the customer explicitly
  // starts a second order (clientState moves to WAITING_PHONE etc. above), this branch is never reached
  // for it again - the old order simply continues as a background card instead.
  // orders.listActiveOrders (what ctx.orders is built from) only excludes COMPLETED/FAILED/CANCELLED -
  // a TRAINING_FAILED/PAYMENT_FAILED/AUTH_FAILED/MANUAL_REVIEW order is NOT terminal by that narrower
  // definition (it's still useful for background-card display), so it can stay in ctx.orders
  // indefinitely - must check the entry's OWN status here, or a genuinely failed watched order would
  // show "activating" forever instead of ever reaching the failed screen.
  const FAILURE_STATUSES=['TRAINING_FAILED','PAYMENT_FAILED','AUTH_FAILED','MANUAL_REVIEW','CANCELLED'];
  const mine = watchedOrderId();
  const mineEntry = mine && Array.isArray(ctx.orders) ? ctx.orders.find(o => o.orderId === mine) : null;
  if(mineEntry){
   engagedThisSession = true;
   if(FAILURE_STATUSES.includes(mineEntry.orderStatus)){ forgetWatchedOrder(); return showScreen('failed'); }
   return showScreen('connected');
  }
  if(!engagedThisSession) return showScreen('packages');
  // Live-run forensic fix (2026-09-04): a real training failure moves the client TRAINING_FAILED->
  // ACTIVE in one backend transaction (the client must never be left stuck) - so by the time this
  // poll lands, clientState already reads ACTIVE exactly like a genuine success does. Confirmed live:
  // a customer saw "всё круто" for an order support was paged about as failed, in the same instant.
  // ctx.lastOrder (the client's most recent order, any status) is the real signal - never clientState
  // alone - for which of the two screens below this actually was.
  const failed = ctx.lastOrder && FAILURE_STATUSES.includes(ctx.lastOrder.status);
  forgetWatchedOrder();
  return showScreen(failed ? 'failed' : 'connected');
 }
 if(['TRAINING_FAILED','PAYMENT_FAILED','AUTH_FAILED','MANUAL_REVIEW'].includes(state)){ engagedThisSession=true; return showScreen('failed'); }
 return showScreen('packages');
}

let pollTimer = null;
let currentPollScreen = null;
function stopPoll(){ if(pollTimer){ clearInterval(pollTimer); pollTimer = null; } currentPollScreen = null; document.getElementById('reconnectBanner').hidden = true; }
// Live-run resilience fix (2026-09-04): a poll failure used to be swallowed completely silently -
// during a brief staging deploy restart (routine while iterating on backend fixes) the screen simply
// froze with zero feedback until the customer manually refreshed. Three consecutive misses (~10s)
// now shows a small "reconnecting" hint instead of nothing; it clears itself the moment a poll
// succeeds again. This never touches which screen renders - only whether this hint is visible.
let pollFailures = 0;
// Live-run forensic fix (2026-09-09, round 13): confirmed live - the site could get stuck showing a
// stale screen until the customer manually reloaded, with no error ever visible. Root cause: a single
// slow poll (api()'s own retry logic can legitimately take up to ~36s on a rough connection) doesn't
// stop the next setInterval tick from firing 3.5s later anyway - each slow poll left a NEW one stacking
// on top of it, and with enough of these piled up at once the browser's own per-origin connection limit
// gets saturated, so even a poll that WOULD have succeeded never gets to run at all. This is invisible -
// no error, no banner, the screen just never updates again until a full reload clears every pending
// request at once. pollInFlight makes a tick that's still waiting on the last one a no-op instead of
// starting another - there is never more than one poll request in flight, so nothing can pile up.
let pollInFlight = false;
async function pollTick(){
 if(pollInFlight) return;
 pollInFlight = true;
 try{ await refreshContext(); pollFailures = 0; document.getElementById('reconnectBanner').hidden = true; render(); }
 catch(e){ pollFailures++; if(pollFailures>=3) document.getElementById('reconnectBanner').hidden = false; }
 finally{ pollInFlight = false; }
}
// Live-run forensic fix (2026-09-09): confirmed live - showScreen() used to call startPoll()
// unconditionally on every same-screen re-render triggered by the poll's own render() call, tearing
// down and rebuilding the interval every ~3.5s even though nothing about the screen changed. Harmless
// on its own, but it also meant the very first check after landing on 'checking'/'connected' had to
// wait the full interval before firing at all - a customer moving from "проверяем платёж" straight into
// a code that already arrived could sit looking at a stale screen for up to 3.5s before the first poll
// even happened, which read as "stuck" often enough to prompt a manual reload. startPoll() now only
// resets anything when the screen name has genuinely changed, and fires one check immediately instead
// of waiting for the first tick - a customer who already has an answer waiting sees it right away.
function startPoll(screenName){
 if(currentPollScreen===screenName) return;
 stopPoll();
 currentPollScreen = screenName;
 pollFailures = 0;
 pollTick();
 pollTimer = setInterval(pollTick, 3500);
}

function showScreen(name, extra){
 const pollable = ['checking','connected'].includes(name);
 if(!pollable) stopPoll();
 setBack(false);
 // Owner request (2026-09-06/09-07): the BEELINE/GEO MASTER brand block only makes sense on the first
 // (package choice) and final (connected) screens - hidden everywhere in between (it just eats space
 // on a customer's active form-filling steps).
 document.querySelector('.brand').hidden = !['packages','connected'].includes(name);
 const el = screensEl();
 if(name==='noEntry') el.innerHTML = tplMessage(lang==='kk'?'Байланыс орнатылмады':'Не удалось подключиться', lang==='kk' ? 'Интернет байланысын тексеріп, бетті қайта жүктеңіз.' : 'Проверьте интернет-соединение и обновите страницу.', 'err', '⚠️');
 else if(name==='paused') el.innerHTML = tplMessage(t('fail_title'), (extra&&extra.message) || '', 'err', '⏸');
 else if(name==='packages') renderPackages(el);
 else if(name==='phone') renderPhone(el);
 else if(name==='receipt') renderReceipt(el);
 else if(name==='checking') renderChecking(el);
 else if(name==='otp') renderOtp(el);
 else if(name==='connected') renderConnected(el);
 else if(name==='failed') renderFailed(el);
 // Live-run UX fix (2026-09-07): polling only runs on 'checking' (waiting for a payment webhook) and
 // 'connected' (waiting to see whether this order finishes or fails) - the only two screens with
 // something server-side actually worth watching. phone/receipt/otp are short, client-driven form
 // steps with nothing to poll for; a poll there used to fully re-render the screen every ~3.5s,
 // destroying in-progress inline state (confirmed live: the OTP screen's "change number" form opened
 // and vanished within seconds).
 if(pollable) startPoll(name);
}

function isInAppBrowser(){ return /musical_ly|TikTok|BytedanceWebview|FBAN|FBAV|FB_IAB|FBIOS|Instagram/i.test(navigator.userAgent||''); }
// Live-run forensic fix (2026-09-07): the Android intent:// auto-redirect this used to attempt here
// (escapeToSystemBrowser) is gone - confirmed live, TikTok's own WebView actively intercepts and
// rejects intent:// navigation with a native "не удалось выполнить действие" error shown to the
// customer, instead of silently doing nothing or falling through to JS. There is no way for page JS to
// detect that rejection and fall back (the OS/host app shows its own error, nothing reaches our code),
// so a "try it, hope it works" auto-redirect risks trading a solvable problem (customer stuck in the
// wrong browser) for a worse, scarier one (a page that visibly errors). The overlay below never
// attempts any navigation at all - it only shows instructions and offers to copy the link - so it
// cannot fail loudly on any platform, Android included.
// iOS never had an automatic option to begin with: Apple's WKWebView sandbox gives page JS no way to
// hand off to Safari - only the host app's own "Open in browser"/"Open in Safari" menu item can do it.
// Wording is deliberately app-agnostic (no "TikTok" hardcoded) since the same overlay now covers
// TikTok/Instagram/Facebook, and all three expose the same ⋯/share-menu mechanism.
function showBrowserEscapeOverlay(){
 const wrap = document.createElement('div');
 wrap.className = 'inapp-overlay';
 wrap.innerHTML = `

 document.body.appendChild(wrap);
 document.getElementById('inappCopy').addEventListener('click', async ()=>{
  try{ await navigator.clipboard.writeText(location.href); }

 });
 document.getElementById('inappDismiss').addEventListener('click', ()=>{ wrap.remove(); });

    <div class="receipt-row"><span class="k">${esc(t('number'))}</span><span class="v" style="display:flex;align-items:center;gap:8px">${esc(formatFullPhoneDisplay(phone))}<button id="changeNumberLink" style="background:none;border:none;padding:0;font:700 12px var(--body);color:var(--blue);text-decoration:underline;cursor:pointer">${esc(t('change_number_link'))}</button></span></div>
   </div>
   ${wrong?`<div class="error-banner" style="margin-top:14px">⚠️ ${esc(t('wrong_desc'))} ${esc(t('attempts_left'))} ${pendingOtpAttempts}</div>`
          :`<div class="info-box" style="margin-top:14px;text-align:left"><div class="ico">✓</div><div>${esc(t('otp_valid'))} ${esc(t('otp_secret'))}</div></div>`}
   ${justResent?`<div style="color:var(--blue);font:700 12.5px var(--body);margin-top:8px">${esc(t('resend_sent'))}</div>`:''}
   ${resendFailed?`<div style="color:var(--danger);font:700 12.5px var(--body);margin-top:8px">${esc(t('resend_failed'))}</div>`:''}
   <label style="text-align:left;margin-top:18px">${esc(t('enter_code'))}</label>
   <div class="otp" id="otpBoxes">${Array.from({length:6}).map((_,i)=>`<input maxlength="1" inputmode="numeric" data-i="${i}">`).join('')}</div>
   <button class="btn btn-primary" id="otpConfirm" disabled>${esc(t('confirm'))} →</button>
   <div class="timer" id="resendWrap"></div>
   <div id="changeNumberForm" hidden style="text-align:left;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)">
    <label>${esc(t('change_number_title'))}</label>
    <p style="color:var(--ink-dim);font:500 12.5px var(--body);margin-bottom:10px">${esc(t('change_number_desc'))}</p>
    <div class="phoneinput"><span>+7-</span><input id="newPhoneInput" inputmode="numeric" maxlength="20" placeholder="XXX-XXX-XX-XX" autocomplete="tel"></div>
    <div id="changeNumberNotice"></div>
    <div style="display:flex;gap:10px;margin-top:12px">
     <button class="btn" id="changeNumberCancel" style="background:var(--line);color:var(--ink)">${esc(t('change_number_cancel'))}</button>
     <button class="btn btn-primary" id="changeNumberSubmit">${esc(t('change_number_btn'))}</button>
    </div>
   </div>
  </div>
  ${supportBlock()}
  ${footBlock()}
 `;
 bindSupport();
 // Live-run UX fix (2026-09-04): the entered number and its "change" action now sit right on the
 // receipt row (visible in BOTH the normal and wrong-code renders - it used to disappear on a wrong
 // attempt, and the change link itself lived in a separate block below the resend timer entirely).
 document.getElementById('changeNumberLink').addEventListener('click', ()=>{
  document.getElementById('changeNumberForm').hidden = false;
  document.getElementById('newPhoneInput').focus();
 });
 document.getElementById('changeNumberCancel').addEventListener('click', ()=>{
  document.getElementById('changeNumberForm').hidden = true;
 });
 const newPhoneInput = document.getElementById('newPhoneInput');
 bindPhoneMask(newPhoneInput);
 document.getElementById('changeNumberSubmit').addEventListener('click', async ()=>{
  const digits = newPhoneInput.value.replace(/\D/g,'');
  if(digits.length<10){ newPhoneInput.style.borderColor='var(--danger)'; return; }
  document.getElementById('changeNumberNotice').innerHTML = '';
  const submitBtn = document.getElementById('changeNumberSubmit'); submitBtn.disabled = true;
  const cancelBtn = document.getElementById('changeNumberCancel'); cancelBtn.disabled = true;
  newPhoneInput.disabled = true;
  const originalLabel = submitBtn.textContent;
  try{
   ctx = await api('/change-phone', {phone: '7'+digits});
   pendingOtpAttempts = 3;
   // Owner report (2026-09-09, round 15): confirmed live - render() here used to navigate straight to
   // the 'checking' screen (client.state briefly reads PAYMENT_CONFIRMED while the fresh job
   // re-authenticates with Beeline for the corrected number) before landing back on THIS SAME otp
   // screen moments later once a new code is ready - a jarring, unnecessary full-screen swap for what
   // the customer experiences as one single action. They're already paid and already on this screen;
   // there's nothing to "check" that needs its own screen. Stay right here with an inline wait instead
   // - the same button just shows a loading label - and only call render() once the real next state (a
   // fresh WAITING_OTP, or a genuine failure) is actually ready. Bounded to ~28s as a safety net: on the
   // rare chance it genuinely never resolves, render() still runs and falls back to the ordinary
   // 'checking' screen rather than leaving this button spinning forever with nothing to show for it.
   submitBtn.textContent = t('otp_checking');
   let waited = 0;
   while(ctx.clientState === 'PAYMENT_CONFIRMED' && waited < 28000){
    await new Promise(r=>setTimeout(r, 700));
    waited += 700;
    await refreshContext().catch(()=>{});
   }
   render();
  }catch(e){
   submitBtn.disabled=false; submitBtn.textContent=originalLabel;
   cancelBtn.disabled=false; newPhoneInput.disabled=false;
   if(e.code==='PHONE_CORRECTION_NOT_EXPECTED'){ await refreshContext().catch(()=>{}); render(); return; }
   if(e.code==='DAILY_PHONE_LIMIT'){
    document.getElementById('changeNumberNotice').innerHTML = dailyLimitBanner();
    document.getElementById('dailyLimitBanner').scrollIntoView({behavior:'smooth',block:'center'});
   }else{
    newPhoneInput.style.borderColor='var(--danger)';
   }
  }
 });
 otpBoxes = Array.from(el.querySelectorAll('#otpBoxes input'));
 const confirmBtn = document.getElementById('otpConfirm');
 function currentCode(){ return otpBoxes.map(b=>b.value).join(''); }
 function updateState(){
  const code = currentCode();
  confirmBtn.disabled = code.length!==6;
  otpBoxes.forEach(b=>b.classList.toggle('filled', !!b.value));
 }
 otpBoxes.forEach((box,i)=>{
  box.addEventListener('input', ()=>{
   box.value = box.value.replace(/\D/g,'');
   if(box.value && otpBoxes[i+1]) otpBoxes[i+1].focus();
   updateState();
  });
  box.addEventListener('keydown', e=>{
   if(e.key==='Backspace' && !box.value && otpBoxes[i-1]) otpBoxes[i-1].focus();
  });
  box.addEventListener('paste', e=>{
   const text = (e.clipboardData||window.clipboardData).getData('text').replace(/\D/g,'').slice(0,6);
   if(text.length===6){ e.preventDefault(); otpBoxes.forEach((b,j)=>b.value=text[j]||''); updateState(); otpBoxes[5].focus(); }
  });
 });
 confirmBtn.addEventListener('click', async ()=>{
  confirmBtn.disabled = true;
  // Live-run fix (2026-09-04): the real Beeline OTP check can take a few seconds - with no feedback
  // the button just looked stuck, which is exactly what led to a submit-again-while-waiting duplicate.
  confirmBtn.textContent = t('otp_checking');
  try{
   ctx = await api('/otp', {code: currentCode()});
   pendingOtpAttempts = 3;
   render();
  }catch(e){
   // OTP_NOT_EXPECTED means the job already moved past WAITING_OTP - almost always because an
   // earlier submission (the slow real check above, or a duplicate click/resubmit while waiting)
   // already succeeded. Showing "code incorrect" here would be flatly wrong - confirmed live: the
   // code was entered correctly, training actually started, and the site still said it didn't match.
   // Refresh and show whatever the real state now is instead of guessing it was a bad code.
   if(e.code==='OTP_NOT_EXPECTED'){ await refreshContext().catch(()=>{}); render(); return; }
   // Live-run forensic fix (2026-09-06): OTP_REJECTED is the ONLY code that genuinely means "you typed
   // the wrong digits, try again" - the backend now auto-retries a real Beeline protocol hiccup
   // (AUTH_PROTOCOL_ERROR) with a fresh code on its own, so if an error still reaches here and it is
   // NOT OTP_REJECTED, the order has already been decided (usually failed) server-side. Confirmed live:
   // painting that as "code incorrect, N attempts left" let the customer believe a retry could still
   // help, when the real outcome (and a Support escalation) had already happened - refresh and show
   // the real current screen instead of guessing it was a typo.
   // Owner request (2026-09-08): OTP_REJECTED_RESENT is the 3rd-wrong-attempt case - the backend
   // already requested a genuinely fresh code from Beeline before returning this, same as clicking
   // "запросить новый код" manually. Tell the customer plainly (justResent=true - the same "new code
   // sent" notice, and the resend timer restarts from now) instead of showing the same generic
   // "wrong code" message a third time with no explanation of what just happened.
   if(e.code==='OTP_REJECTED_RESENT'){
    pendingOtpAttempts = 3;
    otpBoxes.forEach(b=>b.classList.add('bad'));
    renderOtp(el, true, true);
    return;
   }
   // Live-run forensic fix (2026-09-08, round 4): the mandatory resend that's supposed to follow a 3rd
   // wrong code can itself fail (Beeline-side throttling under rapid repeat use) - the backend no longer
   // kills the order over this (see TrainingEngine), so the site must never claim "new code sent" here.
   // Job stays WAITING_OTP - point the customer at the resend button/change-number instead of pretending
   // a fresh code is already on its way.
   if(e.code==='OTP_REJECTED_RESEND_FAILED'){
    otpBoxes.forEach(b=>b.classList.add('bad'));
    renderOtp(el, true, false, true);
    return;
   }
   if(e.code!=='OTP_REJECTED'){ await refreshContext().catch(()=>{}); render(); return; }
   pendingOtpAttempts = Math.max(0, pendingOtpAttempts-1);
   otpBoxes.forEach(b=>b.classList.add('bad'));
   renderOtp(el, true);
   // 2026-09-04: the backend itself already sends a fresh code and resets attempts once the 3rd wrong
   // one lands (server-side WRONG_ATTEMPTS_EXHAUSTED handling, now surfaced explicitly above via
   // OTP_REJECTED_RESENT) - calling /otp-resend here too used to be dead code (this catch never used
   // to fire for a real wrong code, see the OTP_REJECTED fix on the backend), so fixing that would
   // have started sending the customer a duplicate code. Just mirror the reset locally as a fallback
   // in case pendingOtpAttempts' own local count ever drifts from the server's.
   if(pendingOtpAttempts<=0){ pendingOtpAttempts = 3; }
  }
 });
 // Owner request (2026-09-06): clicking "запросить новый код" gave no visible confirmation beyond a
 // tiny "✓" replacing the button text (easy to miss next to the wrong-code error banner above it), and
 // the button then stayed disabled forever - no cooldown, no way to ever ask again. Now it shows an
 // explicit "code sent" message and re-arms itself after a real cooldown, same countdown pattern
 // already used for the first automatic send below.
 // secs<=0 (the anchor's cooldown has already fully elapsed - e.g. the customer took their time typing
 // a wrong code) renders the button immediately instead of a fake "00:00" tick.
 function startResendCooldown(el, secs, justSent){
  if(resendCooldownTimer){ clearInterval(resendCooldownTimer); resendCooldownTimer = null; }
  if(secs<=0){ el.innerHTML = `<button class="resend" id="resendBtn">${esc(t('resend'))}</button>`; bindResendBtn(document.getElementById('resendBtn')); return; }
  el.innerHTML = `<span id="resendCountdown">⏱ ${esc(t('resend_in'))} 00:${String(secs).padStart(2,'0')}</span>` + (justSent ? `<div id="resendSentNotice" style="color:var(--blue);font:700 12.5px var(--body);margin-top:8px">${esc(t('resend_sent'))}</div>` : '');
  const cd = document.getElementById('resendCountdown');
  resendCooldownTimer = setInterval(()=>{
   secs--;
   if(secs<=0){
    clearInterval(resendCooldownTimer);
    resendCooldownTimer = null;
    el.innerHTML = `<button class="resend" id="resendBtn">${esc(t('resend'))}</button>`;
    bindResendBtn(document.getElementById('resendBtn'));
    return;
   }
   const m = String(Math.floor(secs/60)).padStart(2,'0'), s = String(secs%60).padStart(2,'0');
   cd.textContent = `⏱ ${t('resend_in')} ${m}:${s}`;
  }, 1000);
 }
 function bindResendBtn(btn){
  btn.addEventListener('click', async (ev)=>{
   // Live-run forensic fix (2026-09-08, round 4): confirmed live - a burst of 10+ /otp-resend requests
   // landed within 7 seconds for one job. The button's own disabled=true survives until this handler's
   // await resolves, but a customer getting zero feedback on failure (see the old bare catch below) had
   // every reason to keep clicking - resendClickInFlight blocks a second dispatch from this same click
   // handler regardless of DOM state, closing that gap at the source.
   if(resendClickInFlight) return;
   resendClickInFlight = true;
   ev.target.disabled = true;
   const wrap = document.getElementById('resendWrap');
   try{
    await api('/otp-resend', {});
    // A genuine new code just went out - THIS is the real send moment the cooldown must be measured
    // from from now on, same as the very first send.
    otpCodeSentAt = Date.now();
    startResendCooldown(wrap, OTP_RESEND_COOLDOWN_SEC, true);
   }
   catch(e){
    // Live-run forensic fix (2026-09-08, round 4): this used to silently re-enable the button with zero
    // feedback - confirmed live as the direct cause of the click-mashing above ("ничего не происходит").
    // The backend no longer kills the order over a failed resend, so the button stays usable - the
    // customer just needs to be told plainly that this attempt didn't go through.
    ev.target.disabled = false;
    let notice = document.getElementById('resendFailNotice');
    if(!notice){
     notice = document.createElement('div');
     notice.id = 'resendFailNotice';
     notice.style.cssText = 'color:var(--danger);font:700 12.5px var(--body);margin-top:8px';
     wrap.appendChild(notice);
    }
    notice.textContent = t('resend_failed');
   }
   finally{ resendClickInFlight = false; }
  });
 }
 // Live-run forensic fix (2026-09-08, workdata.har re-audit): the resend cooldown matches Beeline's
 // own real minimum with a small safety margin (confirmed against real captured traffic: a genuine
 // resend request landed ~30s after the code was sent, never sooner - 35s gives a little room rather
 // than sitting right on the edge). Uses resendRemainingSec (computed above from otpCodeSentAt), NOT a
 // flat OTP_RESEND_COOLDOWN_SEC every render - entering a wrong code must not reset the wait, only
 // shrink what's left of it, exactly like Beeline's own site.
 startResendCooldown(document.getElementById('resendWrap'), resendRemainingSec, false);
}

function renderFailed(el){
 el.innerHTML = tplMessage(t('fail_title'), t('fail_desc'), 'err', '📵') + supportBlock() + footBlock();
 bindSupport();
 api('/support', {}).catch(()=>{});
}

applyLang();
initSession();
