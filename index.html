<style>

  --red:#E4572E;
  --danger:#E4572E;
  --danger-bg:#FDEDE8;

}
*{box-sizing:border-box;margin:0;padding:0;}
html{-webkit-text-size-adjust:100%;}
body{
  min-height:100svh;
  background:var(--bg);
  color:var(--ink);
  font-family:var(--body);
  display:flex;justify-content:center;
  padding:28px 16px 40px;
}
.wrap{width:100%;max-width:440px;display:flex;flex-direction:column;gap:20px;}
.topbar{display:flex;justify-content:flex-end;}
.langtoggle{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px;gap:2px;}
.langtoggle button{border:none;background:transparent;font:600 13px var(--body);padding:7px 14px;border-radius:999px;color:var(--ink-dim);cursor:pointer;}
.langtoggle button.active{background:var(--yellow);color:var(--black);}
.brand{text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;}
.brand .mark{width:56px;height:56px;border-radius:50%;background:
  repeating-linear-gradient(-35deg,var(--black) 0 9px,var(--yellow) 9px 18px);
  box-shadow:0 6px 16px -6px rgba(0,0,0,.35);}
.brand h1{font:800 30px var(--display);letter-spacing:.5px;}
.brand .tag{display:flex;align-items:center;gap:8px;font:700 11px var(--body);letter-spacing:1.5px;color:var(--ink-dim);text-transform:uppercase;}
.brand .tag i{width:20px;height:1px;background:var(--yellow-deep);display:block;}
.brand .geo{font:700 16px var(--display);}
.brand .geo b{color:var(--yellow-deep);}
.brand .geo u{display:block;width:26px;height:2px;background:var(--black);margin:3px auto 0;text-decoration:none;}
.back{align-self:flex-start;background:none;border:none;font:600 15px var(--body);color:var(--ink);cursor:pointer;display:flex;align-items:center;gap:6px;padding:4px 0;}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:22px;box-shadow:0 10px 30px -18px rgba(20,15,5,.25);}
.subtitle{font:600 15px var(--body);color:var(--ink-dim);text-align:center;margin-bottom:14px;}
.pkg{display:flex;align-items:center;gap:14px;width:100%;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;cursor:pointer;text-align:left;font-family:inherit;transition:transform .12s ease,box-shadow .12s ease;}
.pkg:active{transform:scale(.98);}
.pkg+.pkg{margin-top:12px;}
.pkg .icon{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;flex:none;}
.pkg.lite .icon{background:#FFF3D6;}
.pkg.std .icon{background:#E3EFFF;}
.pkg .info{flex:1;}
.pkg .name{font:800 18px var(--display);}
.pkg .gb{font:800 15px var(--display);color:var(--ink-dim);}
.pkg.std .gb{color:var(--blue);}
.pkg .price{font:700 15px var(--display);background:var(--yellow);padding:8px 12px;border-radius:12px;white-space:nowrap;}
.pkg.std .price{background:#DCEBFF;color:var(--blue);}
.pkg .tag{position:absolute;transform:translate(-6px,-30px);background:var(--blue);color:#fff;font:700 10px var(--body);padding:3px 8px;border-radius:8px;}
.benefits{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:20px;}
.benefits h3{font:800 15px var(--display);margin-bottom:12px;}
.benefits ul{list-style:none;display:flex;flex-direction:column;gap:10px;}
.benefits li{display:flex;align-items:center;gap:10px;font:500 14px var(--body);color:var(--ink);}
.benefits li span.e{font-size:18px;}
label{font:700 13px var(--body);display:block;margin-bottom:8px;}
.phoneinput{display:flex;align-items:center;border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;gap:10px;}
.phoneinput span{font:700 15px var(--display);color:var(--ink-dim);}
.phoneinput input{border:none;outline:none;font:600 17px var(--display);flex:1;background:transparent;letter-spacing:.5px;}
.hint{display:flex;align-items:center;gap:8px;color:var(--ink-dim);font:500 12.5px var(--body);margin-top:12px;}
.btn{width:100%;border:none;border-radius:16px;padding:16px;font:700 16px var(--display);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;transition:transform .12s ease,opacity .12s ease;}
.btn:active{transform:scale(.98);}
.btn:disabled{opacity:.5;cursor:default;}
.btn-primary{background:var(--yellow);color:var(--black);}
.btn-kaspi{background:linear-gradient(135deg,#FF5B34,#E4361A);color:#fff;}
.btn-halyk{background:linear-gradient(135deg,#0B8A3E,#075E2A);color:#fff;}

.receipt{display:flex;flex-direction:column;gap:10px;margin-bottom:16px;}

.receipt-row:last-child{border-bottom:none;}
.receipt-row .k{color:var(--ink-dim);font:500 13.5px var(--body);}
.receipt-row .v{font:700 15px var(--display);}

.center{text-align:center;}
.icon-circle{width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:30px;margin:0 auto 16px;}
.ok{background:#E7F7EE;color:var(--green);}
.err{background:var(--danger-bg);color:var(--danger);}
h2.title{font:800 22px var(--display);text-align:center;margin-bottom:6px;}
p.desc{color:var(--ink-dim);font:500 14.5px var(--body);text-align:center;line-height:1.5;}
.otp{display:flex;gap:8px;justify-content:center;margin:18px 0 8px;}
.otp input{width:44px;height:56px;text-align:center;font:800 22px var(--display);border:1.5px solid var(--line);border-radius:12px;outline:none;}

.otp input.filled{border-color:var(--yellow-deep);background:#FFFBEF;}
.otp input.bad{border-color:var(--danger);background:var(--danger-bg);}
.timer{text-align:center;color:var(--ink-dim);font:500 12.5px var(--body);display:flex;align-items:center;justify-content:center;gap:6px;margin-bottom:16px;}
.resend{background:none;border:1.5px solid var(--danger);color:var(--danger);border-radius:12px;padding:9px 14px;font:700 13px var(--body);cursor:pointer;}
.error-banner{background:var(--danger-bg);border:1px solid #F6C9BA;color:#8A2E13;border-radius:14px;padding:12px 14px;font:600 13.5px var(--body);display:flex;gap:10px;align-items:center;margin-bottom:14px;}

.support .wa{width:42px;height:42px;border-radius:50%;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;flex:none;}

.reward h4{font:800 15px var(--display);margin-bottom:6px;}
.reward p{color:#7A5A10;font:500 13px var(--body);margin-bottom:12px;}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}}

function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function money(n){return new Intl.NumberFormat('ru-RU').format(n);}

// Phone input mask (2026-09-04): people paste their number from WhatsApp in every shape imaginable -
// with the leading 8 Kazakhstan habit ("8777..."), with a + ("+7777..."), or just the bare local part
// with no country code at all - so any run of 11 digits starting with 7 or 8 is treated as "country
// code included" and that leading digit is dropped, rather than making someone hunt for a stray digit
// to delete by hand. Capped at exactly 10 local digits either way.
function normalizePhoneDigits(raw){
 let digits = String(raw||'').replace(/\D/g,'');
 if(digits.length===11 && (digits[0]==='7'||digits[0]==='8')) digits = digits.slice(1);
 return digits.slice(0,10);
}
function formatPhoneDigits(digits){
 return[digits.slice(0,3),digits.slice(3,6),digits.slice(6,8),digits.slice(8,10)].filter(Boolean).join('-');
}
// The +7 prefix is its own static <span> next to the input (see the .phoneinput markup) - this only
// ever formats the 10 local digits, always fully re-derived from normalizePhoneDigits() so a mid-
// paste of an 11-digit number reformats correctly instead of just capping at 10 raw characters.
function bindPhoneMask(input){
 input.addEventListener('input', ()=>{ input.value = formatPhoneDigits(normalizePhoneDigits(input.value)); });
}

async function api(path, body, method){
 const opts = {method: method || (body!==undefined?'POST':'GET'), headers:{'content-type':'application/json'}};
 if(sessionToken) opts.headers.authorization = 'Bearer ' + sessionToken;
 if(body!==undefined) opts.body = JSON.stringify(body);
 const r = await fetch(API_BASE + path, opts);
 const j = await r.json().catch(()=>({}));
 if(!r.ok) throw Object.assign(new Error(j.error||'REQUEST_FAILED'), {code:j.error, status:r.status});
 return j;
}

async function initSession(){
 const tg = window.Telegram && window.Telegram.WebApp;
 let body;
 if(tg && tg.initData){
  tg.ready(); tg.expand();
  body = {initData: tg.initData, language: lang};
 } else {
  const params = new URLSearchParams(location.search);
  const token = params.get('t');
  if(token){ body = {token, language: lang}; }
  else{
   // Live-run UX fix (2026-09-04): a bare visit (no WhatsApp/Telegram link at all) is now a fully
   // supported, standalone entry point - not an error. First time, there's no stored webId yet, so
   // the backend mints one and hands it back (see the res.webId branch below); every later visit from
   // this same browser sends it back and resumes the same account.
   const webId = localStorage.getItem('gm_web_id');
   body = webId ? {webId, language: lang} : {language: lang};
  }
 }
 try{
  const res = await api('/session', body);
  if(res.paused){ showScreen('paused', {message:res.message}); return; }
  if(res.webId) localStorage.setItem('gm_web_id', res.webId);
  sessionToken = res.sessionToken; ctx = res.context;
  if(ctx.client && ctx.client.language) { lang = ctx.client.language; localStorage.setItem('gm_lang', lang); applyLang(); }
  render();
 }catch(e){ showScreen('noEntry'); }
}

async function refreshContext(){ ctx = await api('/status', undefined, 'GET'); }

function screensEl(){ return document.getElementById('screens'); }
function setBack(show, handler){
 const b = document.getElementById('backBtn');
 b.hidden = !show;
 b.onclick = handler || null;
}

function render(){
 if(!ctx) return;
 const state = ctx.clientState;
 if(['NEW','CHOOSING_PACKAGE'].includes(state)) return showScreen('packages');
 if(state==='WAITING_PHONE'){ engagedThisSession=true; return showScreen('phone'); }
 if(state==='WAITING_PAYMENT'){ engagedThisSession=true; return showScreen('receipt'); }
 if(state==='PAYMENT_CONFIRMED'){ engagedThisSession=true; return showScreen('checking'); }
 if(state==='WAITING_OTP'){ engagedThisSession=true; return showScreen('otp'); }
 if(['TRAINING','PROVISIONING'].includes(state)){ engagedThisSession=true; return showScreen('activating'); }
 // ACTIVE/COMPLETED means "free to act, nothing pending" on the backend either way - engagedThisSession
 // is what tells apart "I was just watching this order finish" (success screen) from "fresh page load,
 // ready to order again" (packages screen) - see its own comment above.
 if(['ACTIVE','COMPLETED'].includes(state)){
  if(!engagedThisSession) return showScreen('packages');
  // Live-run forensic fix (2026-09-04): a real training failure moves the client TRAINING_FAILED->
  // ACTIVE in one backend transaction (the client must never be left stuck) - so by the time this
  // poll lands, clientState already reads ACTIVE exactly like a genuine success does. Confirmed live:
  // a customer saw "всё круто" for an order support was paged about as failed, in the same instant.
  // ctx.lastOrder (the client's most recent order, any status) is the real signal - never clientState
  // alone - for which of the two screens below this actually was.
  const FAILURE_STATUSES=['TRAINING_FAILED','PAYMENT_FAILED','AUTH_FAILED','MANUAL_REVIEW','CANCELLED'];
  const failed = ctx.lastOrder && FAILURE_STATUSES.includes(ctx.lastOrder.status);
  return showScreen(failed ? 'failed' : 'success');
 }
 if(['TRAINING_FAILED','PAYMENT_FAILED','AUTH_FAILED','MANUAL_REVIEW'].includes(state)){ engagedThisSession=true; return showScreen('failed'); }
 return showScreen('packages');
}

let pollTimer = null;
function stopPoll(){ if(pollTimer){ clearInterval(pollTimer); pollTimer = null; } document.getElementById('reconnectBanner').hidden = true; }
// Live-run resilience fix (2026-09-04): a poll failure used to be swallowed completely silently -
// during a brief staging deploy restart (routine while iterating on backend fixes) the screen simply
// froze with zero feedback until the customer manually refreshed. Three consecutive misses (~10s)
// now shows a small "reconnecting" hint instead of nothing; it clears itself the moment a poll
// succeeds again. This never touches which screen renders - only whether this hint is visible.
let pollFailures = 0;
function startPoll(){
 stopPoll();
 pollFailures = 0;
 pollTimer = setInterval(async ()=>{
  try{ await refreshContext(); pollFailures = 0; document.getElementById('reconnectBanner').hidden = true; render(); }
  catch(e){ pollFailures++; if(pollFailures>=3) document.getElementById('reconnectBanner').hidden = false; }
 }, 3500);
}

function showScreen(name, extra){
 stopPoll();
 setBack(false);
 const el = screensEl();
 if(name==='noEntry') el.innerHTML = tplMessage(lang==='kk'?'Байланыс орнатылмады':'Не удалось подключиться', lang==='kk' ? 'Интернет байланысын тексеріп, бетті қайта жүктеңіз.' : 'Проверьте интернет-соединение и обновите страницу.', 'err', '⚠️');
 else if(name==='paused') el.innerHTML = tplMessage(t('fail_title'), (extra&&extra.message) || '', 'err', '⏸');
 else if(name==='packages') renderPackages(el);
 else if(name==='phone') renderPhone(el);
 else if(name==='receipt') renderReceipt(el);
 else if(name==='checking'){ renderChecking(el); startPoll(); }
 else if(name==='otp') renderOtp(el);
 else if(name==='activating'){ renderActivating(el); startPoll(); }
 else if(name==='success') renderSuccess(el);
 else if(name==='failed') renderFailed(el);
}

   // screen looked stuck) - the phone was never actually invalid, showing a red border here would be

   if(e.code==='PHONE_NOT_EXPECTED'){ await refreshContext().catch(()=>{}); render(); return; }

   if(e.code==='DAILY_PHONE_LIMIT'){

    document.getElementById('dailyLimitBanner').scrollIntoView({behavior:'smooth',block:'center'});
   }else{
    input.style.borderColor='var(--danger)';
   }
  }
 });
}

 // (goBackToPhone) and returns to phone entry for the same package, so a resubmitted phone number
 // starts a genuinely fresh order rather than colliding with the abandoned one. If a payment happens to
 // land in the same instant (rare race), the backend refuses the cancel - refresh and show whatever
 // the real state now is instead of leaving the screen stuck.
 setBack(true, async ()=>{
  const backBtn = document.getElementById('backBtn'); backBtn.disabled = true;

  document.getElementById('changeNumberNotice').innerHTML = '';
  const submitBtn = document.getElementById('changeNumberSubmit'); submitBtn.disabled = true;
  try{
   ctx = await api('/change-phone', {phone: '7'+digits});
   pendingOtpAttempts = 3;
   render();
  }catch(e){
   submitBtn.disabled=false;
   if(e.code==='PHONE_CORRECTION_NOT_EXPECTED'){ await refreshContext().catch(()=>{}); render(); return; }
   if(e.code==='DAILY_PHONE_LIMIT'){
    document.getElementById('changeNumberNotice').innerHTML = dailyLimitBanner();
    document.getElementById('dailyLimitBanner').scrollIntoView({behavior:'smooth',block:'center'});
   }else{
    newPhoneInput.style.borderColor='var(--danger)';
   }
  }
 });
 otpBoxes = Array.from(el.querySelectorAll('#otpBoxes input'));
 const confirmBtn = document.getElementById('otpConfirm');
 function currentCode(){ return otpBoxes.map(b=>b.value).join(''); }
 function updateState(){
  const code = currentCode();
  confirmBtn.disabled = code.length!==6;
  otpBoxes.forEach(b=>b.classList.toggle('filled', !!b.value));
 }
 otpBoxes.forEach((box,i)=>{
  box.addEventListener('input', ()=>{
   box.value = box.value.replace(/\D/g,'');
   if(box.value && otpBoxes[i+1]) otpBoxes[i+1].focus();
   updateState();
  });
  box.addEventListener('keydown', e=>{
   if(e.key==='Backspace' && !box.value && otpBoxes[i-1]) otpBoxes[i-1].focus();
  });
  box.addEventListener('paste', e=>{
   const text = (e.clipboardData||window.clipboardData).getData('text').replace(/\D/g,'').slice(0,6);
   if(text.length===6){ e.preventDefault(); otpBoxes.forEach((b,j)=>b.value=text[j]||''); updateState(); otpBoxes[5].focus(); }
  });
 });
 confirmBtn.addEventListener('click', async ()=>{
  confirmBtn.disabled = true;
  // Live-run fix (2026-09-04): the real Beeline OTP check can take a few seconds - with no feedback
  // the button just looked stuck, which is exactly what led to a submit-again-while-waiting duplicate.
  confirmBtn.textContent = t('otp_checking');
  try{
   ctx = await api('/otp', {code: currentCode()});
   pendingOtpAttempts = 3;
   render();
  }catch(e){
   // OTP_NOT_EXPECTED means the job already moved past WAITING_OTP - almost always because an
   // earlier submission (the slow real check above, or a duplicate click/resubmit while waiting)
   // already succeeded. Showing "code incorrect" here would be flatly wrong - confirmed live: the
   // code was entered correctly, training actually started, and the site still said it didn't match.
   // Refresh and show whatever the real state now is instead of guessing it was a bad code.
   if(e.code==='OTP_NOT_EXPECTED'){ await refreshContext().catch(()=>{}); render(); return; }
   pendingOtpAttempts = Math.max(0, pendingOtpAttempts-1);
   otpBoxes.forEach(b=>b.classList.add('bad'));
   renderOtp(el, true);
   // 2026-09-04: the backend itself already sends a fresh code and resets attempts once the 3rd wrong
   // one lands (server-side WRONG_ATTEMPTS_EXHAUSTED handling) - calling /otp-resend here too used to
   // be dead code (this catch never used to fire for a real wrong code, see the OTP_REJECTED fix on the
   // backend), so fixing that would have started sending the customer a duplicate code. Just mirror the
   // reset locally.
   if(pendingOtpAttempts<=0){ pendingOtpAttempts = 3; }
  }
 });
 function bindResendBtn(btn){
  btn.addEventListener('click', async (ev)=>{
   ev.target.disabled = true;
   try{ await api('/otp-resend', {}); ev.target.textContent = '✓'; }catch(e){ ev.target.disabled=false; }
  });
 }
 // Live-run UX fix (2026-09-04): a wrong code no longer makes the customer wait out the full 60s
 // countdown before they can ask for a new one - the resend button (already in the markup above for
 // the wrong-code render) is live immediately. The countdown only ever runs on the FIRST, not-yet-
 // wrong render, exactly as before.
 if(wrong){
  bindResendBtn(document.getElementById('resendBtn'));
 }else{
  let secs = 60;
  const cd = document.getElementById('resendCountdown');
  const timer = setInterval(()=>{
   secs--;
   if(secs<=0){
    clearInterval(timer);
    document.getElementById('resendWrap').innerHTML = `<button class="resend" id="resendBtn">${esc(t('resend'))}</button>`;
    bindResendBtn(document.getElementById('resendBtn'));
    return;
   }
   const m = String(Math.floor(secs/60)).padStart(2,'0'), s = String(secs%60).padStart(2,'0');
   cd.textContent = `⏱ ${t('resend_in')} ${m}:${s}`;
  }, 1000);
 }
}

 const completedPkgId = ctx.lastCompletedOrder && ctx.lastCompletedOrder.packageId;
 const pkg = ctx.selectedPackage || (ctx.availablePackages||[]).find(p=>p.id===completedPkgId) || null;
 const gb = pkg ? (pkg.trafficGb || '') : '';
 el.innerHTML = `

    <div class="receipt-row"><span class="k">${esc(t('pkg'))}</span><span class="v">${gb} ГБ</span></div>
   </div>

  </div>
  ${supportBlock()}

 `;
 bindSupport();
 const rbtn = document.getElementById('referralBtn');
 rbtn.addEventListener('click', async ()=>{
  rbtn.disabled = true;
  try{ const res = await api('/referral', {}); rbtn.textContent = res.link; rbtn.onclick=null; if(navigator.clipboard) navigator.clipboard.writeText(res.link).catch(()=>{}); }
  catch(e){ rbtn.disabled=false; }
 });
 // "Buy another package" (2026-09-04): the account is already ACTIVE/free-to-act on the backend -
 // selecting a new package from here is the exact same repeat-purchase path selectPackage always
 // supported (see order-c2-repeat-purchase.test.js). Client-side we just need to stop treating this
 // page load as "just finished" so render() shows packages instead of bouncing back to this screen.
 document.getElementById('buyAgainBtn').addEventListener('click', ()=>{ engagedThisSession = false; showScreen('packages'); });
}

 el.innerHTML = tplMessage(t('fail_title'), t('fail_desc'), 'err', '📵') + supportBlock() + footBlock();
 bindSupport();
 api('/support', {}).catch(()=>{});
}

applyLang();
initSession();
